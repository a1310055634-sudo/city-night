/* ---------- R57 电影感后期：DOF 拍照模式插拔 + 胶片颗粒（C 键）+ 暖冷分级（全部限拍照模式） ----------
   进 P：bloom 后插 BokehPass（焦点=屏幕中心射线命中，无命中 30m，0.35s 跟踪）+尾插暖冷分级/颗粒；
   出 P：全部移除，渲染链回到 V2 四链原样（passes.length 相等硬断言）。L3 自动关 DOF/颗粒。 */
{
  const bokeh=new BokehPass(scene,camera,{focus:30,aperture:0.0016,maxblur:0.0075});
  const cineGrade=new ShaderPass({
    uniforms:{tDiffuse:{value:null},uA:{value:0}},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform sampler2D tDiffuse;uniform float uA;varying vec2 vUv;
      void main(){vec4 c=texture2D(tDiffuse,vUv);
        float l=dot(c.rgb,vec3(0.299,0.587,0.114));
        c.rgb+=uA*((l-0.5)*vec3(1.0,0.72,0.35)+(0.5-l)*vec3(0.35,0.55,1.0));
        gl_FragColor=c;}`});                       // 暖高光冷阴影，强度 0.04
  const filmGrain=new ShaderPass({
    uniforms:{tDiffuse:{value:null},uA:{value:0},uT:{value:0}},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform sampler2D tDiffuse;uniform float uA;uniform float uT;varying vec2 vUv;
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      void main(){vec4 c=texture2D(tDiffuse,vUv);
        c.rgb+=(hash(vUv*vec2(917.0,533.0)+fract(uT*17.3))-0.5)*uA;
        gl_FragColor=c;}`});                       // 胶片颗粒 ±2%
  let grainOn=false,dofIn=false,gradeIn=false,grainIn=false,focusAcc=1;
  const cineRay=new THREE.Raycaster();cineRay.far=140;const cineV=new THREE.Vector2(0,0);
  function centerFocus(){
    cineRay.setFromCamera(cineV,camera);
    const hits=cineRay.intersectObjects(world.children,true)
      .filter(h=>!h.object.isSprite&&!h.object.isPoints&&!h.object.isLine);
    return hits.length?hits[0].distance:30}
  function sync(on){
    if(on){
      const l3=window.__perf&&window.__perf().level===3;
      if(!dofIn){composer.insertPass(bokeh,2);dofIn=true}    // bloom 之后、OutputPass 之前
      bokeh.enabled=!l3;
      if(bokeh.enabled){bokeh.uniforms.focus.value=centerFocus();focusAcc=0}
      if(!gradeIn){composer.addPass(cineGrade);gradeIn=true}
      cineGrade.uniforms.uA.value=0.04;
      if(grainOn&&!l3&&!grainIn){composer.addPass(filmGrain);grainIn=true}
      filmGrain.uniforms.uA.value=grainIn?0.02:0;
    }else{
      if(grainIn){composer.removePass(filmGrain);grainIn=false}
      if(gradeIn){composer.removePass(cineGrade);gradeIn=false}
      if(dofIn){composer.removePass(bokeh);dofIn=false}
      filmGrain.uniforms.uA.value=0;cineGrade.uniforms.uA.value=0;
    }
  }
  window.__cineSync=sync;                            // R30 photoSet 挂接
  function applyGrain(en){                           // 颗粒热插拔（C 键/降级联动共用）
    if(grainOn&&en&&!grainIn){composer.addPass(filmGrain);grainIn=true}
    if((!grainOn||!en)&&grainIn){composer.removePass(filmGrain);grainIn=false}
    filmGrain.uniforms.uA.value=grainIn?0.02:0}
  window.__cineGrain=v=>{grainOn=v===undefined?!grainOn:!!v;
    if(dofIn||gradeIn)applyGrain(!(window.__perf&&window.__perf().level===3));
    return grainOn};
  window.__cineLevel=l=>{                            // R38 applyLevel 挂接：L3 实时关 DOF/颗粒，回 L≤2 自愈
    if(!dofIn&&!gradeIn)return;
    const en=l<3;
    bokeh.enabled=en;
    if(en){bokeh.uniforms.focus.value=centerFocus();focusAcc=0}
    applyGrain(en)};
  window.__grade=gradePass;                          // 验收用：颗粒相位钉固（uT）
  tickers.push((t,dt)=>{                             // 颗粒时变 + 焦点 0.35s 跟踪（仅拍照期间）
    if(!dofIn)return;
    filmGrain.uniforms.uT.value=t;
    focusAcc+=dt;
    if(bokeh.enabled&&focusAcc>0.35){focusAcc=0;bokeh.uniforms.focus.value=centerFocus()}
  });
  window.__cine=()=>({on:dofIn||gradeIn,dof:dofIn&&bokeh.enabled,grain:filmGrain.uniforms.uA.value>0,
    grainFlag:grainOn,passes:composer.passes.length,focus:+bokeh.uniforms.focus.value.toFixed(1),
    chain:composer.passes.map(p=>p.constructor.name).join(',')});
}

/* ---------- R58 河上烟花（名场面，不降级）：单池 ≤2000 粒 + 镜像倒影池（共享几何）+ 常驻闪光灯 ----------
   W 键一组 5 发（菊/牡丹/柳+二段，间隔 2-4s）；?hanabi=1 进页 6s 自动；昼间无效+「夜だけ」提示条。
   稳态 points.visible=false=0 draw；绽放峰值 2 draws。L3 粒子上限减半（发射时读级）。 */
{
  const HAN_Y=0.012;                                   // 河面 y（R17）
  const CAP0=2000;
  const cap=()=>((window.__perf&&window.__perf().level===3)?CAP0>>1:CAP0);
  const pos=new Float32Array(CAP0*3);                  // 交错 xyz（vec3 属性必须 3N 长，标量数组=只渲染 N/3 顶点！）
  const vx=new Float32Array(CAP0),vy=new Float32Array(CAP0),vz=new Float32Array(CAP0);
  const age=new Float32Array(CAP0),ml=new Float32Array(CAP0),sz=new Float32Array(CAP0);
  const dr=new Float32Array(CAP0),gv=new Float32Array(CAP0),sd=new Float32Array(CAP0);
  let cursor=0,alive=0,peakAlive=0,peakDraw=0,prevCap=CAP0;
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aCol',new THREE.BufferAttribute(new Float32Array(CAP0*3),3));
  geo.setAttribute('aSize',new THREE.BufferAttribute(new Float32Array(sz),1));  // 副本：余烬抖动写输出，sz 保持基準
  geo.setAttribute('aAlp',new THREE.BufferAttribute(new Float32Array(CAP0),1));
  const vtx='attribute vec3 aCol;attribute float aSize;attribute float aAlp;uniform float uMirror;uniform float uRiverY;uniform float uT;varying vec3 vC;varying float vA;void main(){vC=aCol;vA=aAlp;vec3 p=position;if(uMirror>0.5){p.y=2.0*uRiverY-p.y;p.x+=sin(p.y*0.7+uT*2.3)*0.22+sin((p.z+13.0)*0.9-uT*1.7)*0.12;}vec4 mv=modelViewMatrix*vec4(p,1.0);gl_PointSize=aSize*(750.0/max(1.0,-mv.z));gl_Position=projectionMatrix*mv;}';
  const frg='uniform float uOp;varying vec3 vC;varying float vA;void main(){vec2 uv=gl_PointCoord-0.5;float d=length(uv)*2.0;float a=pow(max(0.0,1.0-d),1.8)*vA*uOp;if(a<0.004)discard;gl_FragColor=vec4(vC*1.7*a,1.0);}';   // 解析式软盘免采样器（canvas 纹理上传失败会毒化 program 校验）×1.7 HDR 保色相
  const mkMat=(mirror,op)=>new THREE.ShaderMaterial({uniforms:{
      uMirror:{value:mirror},uRiverY:{value:HAN_Y},uT:{value:0},uOp:{value:op}},
    vertexShader:vtx,fragmentShader:frg,transparent:true,depthWrite:false,
    depthTest:!mirror,blending:THREE.AdditiveBlending});
  const pMat=mkMat(0,0.55),mMat=mkMat(1,0.32);
  const pts=new THREE.Points(geo,pMat);pts.frustumCulled=false;pts.visible=false;pts.renderOrder=8;world.add(pts);
  const mir=new THREE.Points(geo,mMat);mir.frustumCulled=false;mir.visible=false;mir.renderOrder=8;world.add(mir);
  // 常驻闪光灯（禁动态增删）：color 置黑=关闭态，绽放设色+强度脉冲 0.4s 衰减，昼间 ×0
  const hanabiLight=new THREE.DirectionalLight(0x000000,0);hanabiLight.position.set(88,26,40);world.add(hanabiLight);
  let flashI=0;
  // 提示条（wxbar 毛玻璃风格，自动淡出）
  const tip=document.createElement('div');tip.id='hanabiTip';
  tip.style.cssText='position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:12;'
    +'padding:7px 14px;border-radius:11px;background:rgba(10,15,28,.7);backdrop-filter:blur(8px);'
    +'border:1px solid rgba(160,190,230,.24);color:#cfdcea;font:12px "Yu Gothic","Meiryo",sans-serif;'
    +'opacity:0;transition:opacity .5s;pointer-events:none;letter-spacing:1px';
  document.body.appendChild(tip);
  function showTip(s){tip.textContent=s;tip.style.opacity=0.92;
    setTimeout(()=>tip.style.opacity=0,2600)}
  const emit=(x,y,z,vx2,vy2,vz2,life,s,c2,g2,d2)=>{
    const i=cursor;cursor=(cursor+1)%cap();          // L3 池减半：游标只在半池内环绕
    pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;vx[i]=vx2;vy[i]=vy2;vz[i]=vz2;
    age[i]=0;ml[i]=life;sz[i]=s;dr[i]=d2;gv[i]=g2;sd[i]=Math.random()*6.28;
    const A=geo.attributes.aCol.array;A[i*3]=c2[0];A[i*3+1]=c2[1];A[i*3+2]=c2[2]};
  // 音景（默认静音纪律）：咻 0.6s 上滑 + 爆=棕噪 lowpass 脉冲+低频 thump，延迟=声速感
  window.__hanabiSnd=(kind,delay)=>{
    const core=window.__audioCore&&window.__audioCore();
    const ac=core&&core.ac();if(!ac||!core.sndOn())return;
    const t0=ac.currentTime+delay,master=core.master();
    if(kind==='rise'){const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.setValueAtTime(350,t0);o.frequency.exponentialRampToValueAtTime(1500,t0+0.6);
      g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.045,t0+0.12);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.65);
      o.connect(g);g.connect(master);o.start(t0);o.stop(t0+0.7)}
    else{const src=ac.createBufferSource();src.buffer=core.noiseBuf()('brown',1.5);
      const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=160;
      const g=ac.createGain();g.gain.setValueAtTime(0.5,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+1.2);
      src.connect(f);f.connect(g);g.connect(master);src.start(t0);
      const o=ac.createOscillator(),g2=ac.createGain();o.type='sine';o.frequency.value=42;
      g2.gain.setValueAtTime(0.22,t0);g2.gain.exponentialRampToValueAtTime(0.0001,t0+0.35);
      o.connect(g2);g2.connect(master);o.start(t0);o.stop(t0+0.4)}};
  // 编排：菊/牡丹/柳/二段，间隔 2-4s
  const HUES=[[1,.32,.22],[.34,.56,1],[1,.42,.66],[.42,1,.6],[1,.8,.35],[.85,.5,1]];
  const shells=[],queue=[];let groupOn=false,groupT0=0;
  const burstRecs=[];
  function bloomAt(s){
    const k=cap()/2000;
    const spec={kiku:{n:140,sp:[5.5,9],life:[1.8,2.2],grav:-2.6,drag:1.4},
                botan:{n:160,sp:[5,8.5],life:[2.0,2.4],grav:-2.6,drag:1.2},
                yanagi:{n:120,sp:[4,6],life:[2.6,3.0],grav:-5.0,drag:0.55},
                nidan:{n:100,sp:[5.5,8.5],life:[1.8,2.2],grav:-2.6,drag:1.4}}[s.type];
    const n=Math.round(spec.n*k);
    for(let i=0;i<n;i++){
      const u=Math.random()*2-1,ph=Math.random()*6.283,rr2=Math.sqrt(1-u*u);
      const sp=spec.sp[0]+Math.random()*(spec.sp[1]-spec.sp[0]);
      let c2;
      if(s.type==='botan')c2=(i&1)?HUES[s.hi%6]:HUES[(s.hi+2)%6];   // 牡丹双色
      else{const h=HUES[s.hi%6];const v=0.85+Math.random()*0.2;c2=[h[0]*v,h[1]*v,h[2]*v]}
      emit(s.x,s.y,s.z,rr2*Math.cos(ph)*sp,u*sp,rr2*Math.sin(ph)*sp,
        spec.life[0]+Math.random()*(spec.life[1]-spec.life[0]),
        0.46+Math.random()*0.26,c2,spec.grav,spec.drag)}
    if(s.type==='nidan'){                              // 二段开花：同帧中心再爆一层
      const h2=HUES[(s.hi+3)%6];
      for(let i=0;i<Math.round(50*k);i++){
        const u=Math.random()*2-1,ph=Math.random()*6.283,rr2=Math.sqrt(1-u*u);
        const sp=2.4+Math.random()*2.2;
        emit(s.x,s.y,s.z,rr2*Math.cos(ph)*sp,u*sp,rr2*Math.sin(ph)*sp,
          1.2+Math.random()*0.4,0.4,[h2[0],h2[1],h2[2]],-2.0,1.8)}}
    const h=HUES[s.hi%6];
    hanabiLight.color.setRGB(h[0],h[1],h[2]);hanabiLight.position.set(s.x,s.y,s.z);
    flashI=2.4;
    const rec=burstRecs[s.idx];rec.bloomed=true;rec.boomDelay=0.3+Math.random()*0.5;
    window.__hanabiSnd('bloom',rec.boomDelay)}
  function launchGroup(){
    if(dayE>0.6){showTip('夜だけ（烟花只在夜里绽放）');return false}
    if(groupOn)return false;
    groupOn=true;groupT0=0;burstRecs.length=0;
    let at=0.15;
    const types=['kiku','botan','yanagi','nidan','kiku'];
    for(let i=0;i<5;i++){queue.push({at,type:types[i],idx:i});at+=2+Math.random()*2}
    return true}
  function fireShell(type,idx,zAt){
    const x0=86+Math.random()*1.5,z0=zAt===undefined?(Math.random()<0.5?34:50):zAt;   // 星見橋下游南岸·西堤双发射位
    const tx=87.5+Math.random()*2.5,ty=20+Math.random()*9,tz=z0+rr(-6,10);
    const tt=1.35+Math.random()*0.35;
    shells.push({x:x0,y:0.4,z:z0,vx:(tx-x0)/tt,vy:(ty-0.4)/tt,vz:(tz-z0)/tt,
      t:0,tt,type,hi:(idx*2+1)%6,idx,trailAcc:0});
    burstRecs[idx]={type,bloomed:false,boomDelay:0};
    window.__hanabiSnd('rise',0.05)}
  tickers.push((t,dt)=>{
    pMat.uniforms.uT.value=t;mMat.uniforms.uT.value=t;
    if(groupOn){groupT0+=dt;
      while(queue.length&&queue[0].at<=groupT0){const q=queue.shift();fireShell(q.type,q.idx)}
      if(queue.length===0&&shells.length===0&&alive===0)groupOn=false}
    for(let i=shells.length-1;i>=0;i--){const s=shells[i];   // 上升壳+尾迹
      s.t+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;
      s.trailAcc+=dt*240;
      while(s.trailAcc>=1){s.trailAcc--;
        emit(s.x+rr(-0.12,0.12),s.y+rr(-0.1,0.1),s.z+rr(-0.12,0.12),
          s.vx*0.12+rr(-0.4,0.4),s.vy*0.1+rr(-0.3,0.3),s.vz*0.12+rr(-0.4,0.4),
          0.4+Math.random()*0.3,0.2+Math.random()*0.12,[1,0.74,0.34],-1.2,2.0)}
      if(s.t>=s.tt){bloomAt(s);shells.splice(i,1)}}
    const A=geo.attributes.aCol.array,AL=geo.attributes.aAlp.array,S=geo.attributes.aSize.array;
    let cnt=0;
    const cp=cap();
    for(let i=0;i<cp;i++){
      if(ml[i]<=0||age[i]>=ml[i]){if(AL[i]!==0)AL[i]=0;continue}
      age[i]+=dt;cnt++;
      const dc2=Math.exp(-dr[i]*dt);
      vx[i]*=dc2;vy[i]=vy[i]*dc2+gv[i]*dt;vz[i]*=dc2;
      pos[i*3]+=vx[i]*dt;pos[i*3+1]+=vy[i]*dt;pos[i*3+2]+=vz[i]*dt;
      const f=1-age[i]/ml[i];
      let a=Math.pow(f,1.35);
      if(f<0.3){a*=0.55+0.45*Math.sin(age[i]*47+sd[i]);   // 末期余烬闪烁
        S[i]=sz[i]*(0.8+0.35*Math.sin(age[i]*53+sd[i]))}
      else S[i]=sz[i];
      AL[i]=a}
    geo.attributes.position.needsUpdate=true;geo.attributes.aCol.needsUpdate=true;
    geo.attributes.aAlp.needsUpdate=true;geo.attributes.aSize.needsUpdate=true;
    alive=cnt;if(cnt>peakAlive)peakAlive=cnt;
    if(cp<prevCap)for(let i=cp;i<prevCap;i++)AL[i]=0;   // L3 中途降级：半池外粒子立即熄灭
    prevCap=cp;
    const vis=cnt>0||shells.length>0;pts.visible=vis;mir.visible=vis;
    if(flashI>0){flashI=Math.max(0,flashI-dt*6);          // 闪光 0.4s 衰减+昼灭
      hanabiLight.intensity=flashI*(1-dayE);
      if(flashI===0)hanabiLight.color.setHex(0)}
    peakDraw=Math.max(peakDraw,renderer.info.render.calls)});
  if(params.get('hanabi')!==null)setTimeout(()=>launchGroup(),6000);
  window.__hanabiLaunch=launchGroup;
  window.__hanabiFire=(t,i)=>fireShell(t,i);   // 验收钩子：强制单发（双发同框/柳垂尾取景用）
  window.__hanabiRefs=[pts,mir];
  window.__hanabiKey=()=>{showTip(launchGroup()?'たあっ——（星見川の上へ）':'夜だけ（烟花只在夜里绽放）')};
  window.__hanabi=()=>({on:groupOn,bursts:Array.from(burstRecs,b=>b?{type:b.type,bloomed:b.bloomed,boomDelay:+b.boomDelay.toFixed(3)}:{type:'-',bloomed:false,boomDelay:0}),   // Array.from 访洞（map 跳洞是空操作）
    particles:alive,peak:peakAlive,peakDraw,cap:cap(),
    visible:pts.visible,lit:hanabiLight.intensity>0});
}

/* ---------- R59 QA 只读暴露：天气/漫游/控制 ---------- */
{
  window.__wx=()=>({precip,blend:+weatherBlend.toFixed(3),dayE:+dayE.toFixed(3)});
  window.__tour=()=>({on:tourOn,idx:tourIdx});
  window.__controls=controls;
}
