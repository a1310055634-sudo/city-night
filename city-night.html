function piecewise(p,K){for(let i=0;i<K.length-1;i++){

const geoCache=new Map();
function boxGeo(w,h,d){const k='b'+w+','+h+','+d;if(!geoCache.has(k))geoCache.set(k,new THREE.BoxGeometry(w,h,d));return geoCache.get(k)}
function cylGeo(rt,rb,h,seg=14){const k='c'+rt+','+rb+','+h+','+seg;if(!geoCache.has(k))geoCache.set(k,new THREE.CylinderGeometry(rt,rb,h,seg));return geoCache.get(k)}

const matCache=new Map();
function toon(hex,opt){const key='T'+hex+'/'+(opt?JSON.stringify(opt):'');
  if(matCache.has(key))return matCache.get(key);
  const m=new THREE.MeshToonMaterial({color:hex,gradientMap:gradTex,...(opt||{})});
  matCache.set(key,m);return m}

/* 带描边的盒子 / 圆柱 */
function B(w,h,d,color,x,y,z,o){o=o||{};
  const m=new THREE.Mesh(boxGeo(w,h,d),o.mat||toon(color));
  m.position.set(x,y,z);if(o.ry)m.rotation.y=o.ry;if(o.rx)m.rotation.x=o.rx;if(o.rz)m.rotation.z=o.rz;
  m.castShadow=o.cast!==false;m.receiveShadow=!!o.recv;
  const t=o.o===undefined?0.03:o.o;
  if(t>0){const ol=new THREE.Mesh(m.geometry,outlineMat);
    ol.scale.set((w+2*t)/w,(h+2*t)/h,(d+2*t)/d);m.add(ol)}
  return m}
function CYL(rt,rb,h,color,x,y,z,o){o=o||{};
  const seg=o.seg||14;
  const m=new THREE.Mesh(cylGeo(rt,rb,h,seg),o.mat||toon(color));
  m.position.set(x,y,z);if(o.ry)m.rotation.y=o.ry;if(o.rx)m.rotation.x=o.rx;if(o.rz)m.rotation.z=o.rz;
  m.castShadow=o.cast!==false;m.receiveShadow=!!o.recv;
  const t=o.o===undefined?0.025:o.o;
  if(t>0){const ol=new THREE.Mesh(m.geometry,outlineMat);
    ol.scale.set((rt+t)/rt,(h+2*t)/h,(rb+t)/rb);m.add(ol)}
  return m}
function PLANE(w,h,mat,x,y,z,o){o=o||{};
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
  m.rotation.x=-Math.PI/2;if(o.ry)m.rotation.z=o.ry; // 平面绕z转=世界y转
  m.rotation.x=-Math.PI/2;m.rotation.z=o.rz||0;

  m.position.set(x,y,z);m.receiveShadow=!!o.recv;m.renderOrder=o.ro||0;
  return m}

    shopFades.push(e=>{lampM.color.copy(lampM.userData._b||(lampM.userData._b=lampM.color.clone())).multiplyScalar(1-0.85*e);

      let target=c.vBase*wf;
      if(!c.bus&&window.__sigFor){const sg=window.__sigFor(c);
        if(sg){if(sg.hold){c.v=0;continue}                    // R47：红灯线前定身（须在 target 声明后，防 TDZ）
          if(sg.brake)target=Math.min(target,Math.max(0,(sg.rem-sg.line)*1.5))}}
      if(c.turn){                                   // 路口内：贝塞尔弧线
        target*=0.5;
        c.turn.t+=dt*c.v/c.turn.len;
        const{p0,p1,p2}=c.turn,tt=Math.min(c.turn.t,1);
        const tx=2*(1-tt)*(p1[0]-p0[0])+2*tt*(p2[0]-p1[0]),
              tz=2*(1-tt)*(p1[1]-p0[1])+2*tt*(p2[1]-p1[1]);
        c.g.position.set(bez(p0[0],p1[0],p2[0],tt),0,bez(p0[1],p1[1],p2[1],tt));
        c.g.rotation.y=Math.atan2(-tz,tx);          // 本车前向=局部+X：ry=atan2(-z,x)
        if(c.turn.t>=1){c.e=c.turn.next;c.s=0;c.turn=null}
      }else{
        if(c.e.len-c.s<NODE_R)target*=0.45;         // 路口礼让减速
        c.v+=Math.max(-9*dt,Math.min(4.5*dt,target-c.v));
        c.s+=c.v*dt;
        if(c.s>=c.e.len){
          const nx=pickNext(c.e),sl=c.s-c.e.len;
          if(nx){
            const bx=c.e.ax+c.e.dx*c.e.len,bz=c.e.az+c.e.dz*c.e.len;
            if(nx.dx===c.e.dx&&nx.dz===c.e.dz){c.e=nx;c.s=sl}    // 直行无缝续边
            else{                                                  // 转弯：节点贝塞尔
              const p0=[bx+c.e.dz*LANE,bz-c.e.dx*LANE],
                    p2=[bx+nx.dz*LANE,bz-nx.dx*LANE];
              c.turn={p0,p1:[bx,bz],p2,t:0,
                len:Math.hypot(p0[0]-p2[0],p0[1]-p2[1])+2.5,next:nx}
            }
          }else c.s=c.e.len;
        }
        if(!c.turn){                                // 直行贴车道中心线（左侧通行）
          c.g.position.set(c.e.ax+c.e.dx*c.s+c.e.dz*LANE,0,
                           c.e.az+c.e.dz*c.s-c.e.dx*LANE);
          c.g.rotation.y=Math.atan2(-c.e.dz,c.e.dx);
        }
      }
    }
    // 跟车：前锥随速扩展（9+v×0.6）+ 车长感知硬停止（R47：信号排队间距=中心距 6m/8.9m 大巴， bumper ≥1.2m）
    for(const a of cars){
      const fx=Math.cos(a.g.rotation.y),fz=-Math.sin(a.g.rotation.y);
      const cone=9+a.v*0.6;
      for(const b of cars){if(b===a)continue;
        const dx=b.g.position.x-a.g.position.x,dz=b.g.position.z-a.g.position.z;
        const along=dx*fx+dz*fz;if(along<=0||along>cone)continue;
        const lat=Math.abs(-dx*fz+dz*fx);if(lat>1.7)continue;
        const need=(b.bus?5.4:2.3)+(a.bus?5.4:2.3)+1.2;
        if(along<need){a.v=Math.min(a.v,Math.max(0,(along-need+0.5)*2))}
        else if(a.v>b.v)a.v=Math.max(b.v*0.9,a.v-9*dt)}}
  });
  window.__traffic=()=>cars.map(c=>({x:+c.g.position.x.toFixed(2),z:+c.g.position.z.toFixed(2),
    ry:+c.g.rotation.y.toFixed(3),v:+c.v.toFixed(2),st:c.turn?'turn':'run'}));
  window.__trafficCars=cars.map(c=>c.g);   // 性能对比/调试用：车组句柄
  window.__trafficFleet=cars;              // R46：特种车（巴士/出租车）注入口
}

/* ---------- R22 通勤列车：ほしみ駅 2 节ワンマン shuttle ----------
   轨道 x∈[21.4,43.6]（站台两侧被 x=16 垂直停车/x=48 车道夹死，净空仅 22m），
   两端设门架+暗壳（假隧道）：列车从壳内驶出→制动进站→停 8s→加速钻入对端壳内隐匿
   40-70s→反向再入。零道口零拆改；雷雨限速 60%；昼间窗光×0.15。 */
{
  const TZ=-69.4,EX0=24.6,EX1=40.2,STOP=32.5;   // EX0/EX1=两端隐匿触发点（车头不出轨道净空）

  for(const[fr,sh0,sh1]of[[22.4,20.4,22.4],[42.6,42.6,44.0]]){

    pg.add(B(0.5,0.5,4.5,0x454c58,fr,4.5,TZ,{o:0.025}));
    const bs=B(0.56,0.07,4.6,0,fr,4.79,TZ,{o:0,cast:false,mat:snowMat});pg.add(bs);extraCaps.push(bs);
    const deep=sh1-sh0;
    pg.add(B(deep,0.1,3.3,0x05070c,(sh0+sh1)/2,3.55,TZ,{o:0,cast:false}));           // 壳顶
    for(const s of[1,-1])pg.add(B(deep,3.5,0.1,0x05070c,(sh0+sh1)/2,1.78,TZ+s*1.62,{o:0,cast:false})); // 壳侧
  }
  // 站前广播柱（停站时绿灯亮起，R31 音景预留触发点）
  const spkLight=new THREE.MeshBasicMaterial({color:0x9fe8b8});spkLight.color.multiplyScalar(0.35);
  {const pg=new THREE.Group();pg.position.set(36.5,0,-61.8);city.add(pg);
   pg.add(CYL(0.04,0.06,2.4,0x39404c,0,1.2,0,{o:0.012,seg:8}));
   pg.add(B(0.34,0.5,0.24,0x4a525e,0,2.35,0,{o:0.015}));
   const ball=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),spkLight);ball.position.set(0.19,2.48,0);pg.add(ball)}
  // 列车本体（2 节，共享材质）
  const trainG=new THREE.Group();trainG.position.set(STOP,0,TZ);trainG.visible=false;city.add(trainG);
  const bodyM=new THREE.MeshStandardMaterial({color:0xdfe4ea,roughness:0.42,metalness:0.55,envMapIntensity:0.7});
  const winMat=new THREE.MeshBasicMaterial({color:0xffd9a0});

  const doorMat=toon(0x2a323c);
  const headMatT=new THREE.MeshBasicMaterial({color:0xfff2cc,transparent:true,opacity:0});
  for(let i=0;i<2;i++){
    const g=new THREE.Group();g.position.x=(i-0.5)*7.5;trainG.add(g);
    g.add(B(7.2,1.9,2.1,0,0,1.5,0,{o:0.025,mat:bodyM}));
    g.add(B(7.0,0.55,2.0,0x232830,0,0.28,0,{o:0.012}));
    g.add(B(6.9,0.16,2.16,0,0,2.56,0,{o:0,cast:false,mat:snowMat}));extraCaps.push(g.children[g.children.length-1]);
    for(const s of[1,-1]){
      g.add(B(5.6,0.62,0.05,0,0,1.72,s*1.06,{o:0.006,mat:winMat,cast:false}));
      g.add(B(0.85,1.5,0.04,0,0,1.15,s*1.06,{o:0.006,mat:doorMat,cast:false}));
      g.add(B(0.85,1.5,0.04,0,0,-1.6,s*1.06,{o:0.006,mat:doorMat,cast:false}))}
    if(i===0){ // 西端驾驶室：斜窗+头灯
      g.add(B(0.1,1.25,1.9,0x1a2026,-3.62,2.0,0,{o:0.01,rx:-0.28}));
      for(const s of[0.62,-0.62]){const hl=new THREE.Mesh(boxGeo(0.07,0.16,0.16),headMatT);
        hl.position.set(-3.78,0.9,s);g.add(hl)}}
    if(i===1){ // 东端驾驶室（往返双向）
      g.add(B(0.1,1.25,1.9,0x1a2026,3.62,2.0,0,{o:0.01,rx:0.28}));
      for(const s of[0.62,-0.62]){const hl=new THREE.Mesh(boxGeo(0.07,0.16,0.16),headMatT);
        hl.position.set(3.78,0.9,s);g.add(hl)}}

  {const p1=B(0.05,0.75,0.05,0x39404c,0.9,2.95,0,{o:0.008,rz:0.45});trainG.children[0].add(p1);
   const p2=B(0.7,0.04,0.04,0x39404c,1.15,3.3,0,{o:0.008});trainG.children[0].add(p2)}
  // 状态机：hidden→brake→dwell(8s)→run→hidden；方向交替；雷雨限速 60%
  let st='hidden',timer=rr(6,12),x=STOP,v=0,dir=1;
  dayFade(()=>{headMatT.opacity=0.95*(1-dayE);
    winMat.color.copy(winBase).multiplyScalar((st==='dwell'?1.35:1)*(1-0.85*dayE))});
  tickers.push((t,dt)=>{
    const lim=precip==='thunder'?0.6:1;          // 雷雨限速 60%（出棚/巡航同乘）
    const cruise=7.2*lim;
    if(st==='hidden'){timer-=dt;
      if(timer<=0){dir=-dir;st='brake';trainG.visible=true;
        x=dir>0?EX0:EX1;v=5.6*lim}}
    else if(st==='brake'){v=Math.max(0.9,v-(precip==='thunder'?1.1:1.9)*dt);x+=dir*v*dt;
      if((dir>0&&x>=STOP)||(dir<0&&x<=STOP)){x=STOP;v=0;st='dwell';timer=8;
        spkLight.color.setHex(0x9fe8b8).multiplyScalar(1.35)}}
    else if(st==='dwell'){timer-=dt;
      if(timer<=0){st='run';spkLight.color.setHex(0x9fe8b8).multiplyScalar(0.35)}}
    else if(st==='run'){v=Math.min(cruise,v+1.3*dt);x+=dir*v*dt;
      if((dir>0&&x>=EX1)||(dir<0&&x<=EX0)){
        trainG.visible=false;st='hidden';
        timer=isRush()?rr(18,32):rr(40,70)}}   // R26：早晚高峰班次加密
    trainG.position.x=x;
  });
  window.__train=()=>({x:+x.toFixed(2),v:+v.toFixed(2),state:st,dir});
  window.__trainG=trainG;   // 性能对比/调试：列车组句柄

/* ---------- R23 城市呼吸：逐窗明灭节律 + 霓虹追逐/滚动 + 门口灯牌呼吸 + 冠灯呼吸 ---------- */
{
  // 1) 霓虹追逐灯带：东霓虹区 (31,24) 楼南墙 y7.2，14 管流动
  const CH_N=14,chasM=new THREE.MeshBasicMaterial({color:0xffffff});
  const chase=new THREE.InstancedMesh(boxGeo(0.34,0.34,0.1),chasM,CH_N);
  {const M=new THREE.Matrix4();
   for(let i=0;i<CH_N;i++){M.makeTranslation(23+i*(16/(CH_N-1)),7.2,19.92);chase.setMatrixAt(i,M)}
   chase.instanceMatrix.needsUpdate=true}
  city.add(chase);
  const chOn=new THREE.Color(0xff4ac8).multiplyScalar(2.3),chOff=new THREE.Color(0x181020);
  for(let i=0;i<CH_N;i++)chase.setColorAt(i,chOff);
  chase.instanceColor.needsUpdate=true;
  // 2) 滚动字幕灯箱：西霓虹区 (-30,-24) 楼北墙（朝 z=-16 道路），Canvas 双份文字无缝横移
  const marqueeFades=[];
  const marqueeTex=texCanvas(1024,96,(g)=>{
    g.fillStyle='#120a1e';g.fillRect(0,0,1024,96);
    g.strokeStyle='#ff4ac8';g.lineWidth=4;g.strokeRect(3,3,1018,90);
    g.fillStyle='#ffe8f6';g.shadowColor='#ff4ac8';g.shadowBlur=16;
    g.font='bold 44px "Yu Gothic","Meiryo",sans-serif';g.textAlign='center';g.textBaseline='middle';
    for(const ox of[256,768])g.fillText('スターアイズ ◆ スナック ◆ カラオケ',ox,50)});
  marqueeTex.wrapS=THREE.RepeatWrapping;marqueeTex.repeat.x=0.5;
  const marqueeM=new THREE.MeshBasicMaterial({map:marqueeTex});marqueeM.color.multiplyScalar(1.25);
  dayFade(e=>marqueeM.color.setHex(0xffffff).multiplyScalar(1.25*(1-0.9*e)));// R25 修复：原推 shopFades 在漏斗收集之后=昼间不灭
  {const boxG=new THREE.Group();boxG.position.set(-30,6.3,-19.8);city.add(boxG);
   boxG.add(B(4.4,1.12,0.22,0x1a1020,0,0,0,{o:0.02}));
   const face=new THREE.Mesh(new THREE.PlaneGeometry(4.2,0.92),marqueeM);
   face.position.set(0,0,0.13);boxG.add(face);
   for(const s of[0.62,-0.62]){const tube=new THREE.Mesh(cylGeo(0.03,0.03,4.3,8),neonPinkMatSafe());
     tube.rotation.z=Math.PI/2;tube.position.set(0,s,0.1);boxG.add(tube)}}
  function neonPinkMatSafe(){const m=new THREE.MeshBasicMaterial({color:0xff4ac8});
    m.color.multiplyScalar(1.7);marqueeFades.push(m);return m}
  dayFade(e=>{for(const m of marqueeFades)m.color.setHex(0xff4ac8).multiplyScalar(1.7*(1-0.9*e))});
  // 3) 窗光节律状态
  const onCol=new THREE.Color(1,1,1),offCol=new THREE.Color(0.045,0.035,0.025),_lc=new THREE.Color();
  let nextWin=rr(5,12),trans=[],litN=0,totN=0;
  for(const b of winPulse){litN+=b.n;totN+=b.n+b.darkN}
  let chaseIdx=-1;
  tickers.push((t,dt)=>{
    // 窗光：昼间节律休眠（静止维持 ×0.15 全局衰减）
    if(dayE<0.5){
      nextWin-=dt;
      if(nextWin<=0&&trans.length<6){nextWin=rr(20,40);
        const k=1+Math.floor(rnd()*2);
        for(let j=0;j<k&&trans.length<6;j++){
          const b=winPulse[Math.floor(rnd()*winPulse.length)];if(!b||!b.n)continue;
          const ratio=litN/totN,pOn=ratio>0.42?0.22:ratio<0.38?0.78:0.5;
          const wantOn=rnd()<pOn;
          let i=Math.floor(rnd()*b.n),guard=0;
          while(guard++<6&&(b.st[i]===1)===wantOn)i=(i+1)%b.n;
          if((b.st[i]===1)===wantOn)continue;
          b.st[i]=wantOn?1:0;litN+=wantOn?1:-1;
          trans.push({im:b.im,i,from:wantOn?offCol:onCol,to:wantOn?onCol:offCol,t:0})}}
      for(let q=trans.length-1;q>=0;q--){const tr=trans[q];tr.t+=dt/0.8;
        const k=tr.t>=1?1:tr.t*tr.t*(3-2*tr.t);
        tr.im.setColorAt(tr.i,_lc.copy(tr.from).lerp(tr.to,k));
        tr.im.instanceColor.needsUpdate=true;
        if(tr.t>=1)trans.splice(q,1)}}
    // 霓虹追逐（昼停）：9 管/秒流动
    if(dayE<0.5){const ni=Math.floor(t*9)%CH_N;
      if(ni!==chaseIdx){chaseIdx=ni;
        chase.setColorAt((ni+CH_N-1)%CH_N,chOff);chase.setColorAt(ni,chOn);
        chase.instanceColor.needsUpdate=true}
      chasM.color.setScalar(1)}
    else{chasM.color.setScalar(1-0.92*dayE);
      if(chaseIdx>=0){chase.setColorAt(chaseIdx,chOff);chase.instanceColor.needsUpdate=true;chaseIdx=-1}}
    // 滚动字幕（昼停）
    if(dayE<0.5)marqueeTex.offset.x=-((t*0.08)%0.5);
    // 冠灯呼吸 0.1Hz（昼间保留，乘既有昼衰减）+ 门口灯牌微呼吸
    const tc=window.__towerCrown;
    if(tc)tc.m.color.copy(tc.base).multiplyScalar((1-0.9*dayE)*(1+0.18*Math.sin(t*0.6283)));
    fasciaSignMat.color.setScalar(1+0.07*Math.sin(t*0.55));
  });
  window.__pulse=()=>({lit:litN,total:totN,ratio:+(litN/totN).toFixed(3),
    trans:trans.length,door:window.__doorInfo?window.__doorInfo():null,chase:chaseIdx});
}

/* ---------- R24 全局风场：uniform 注入（雪强/雨轻/蒸汽漂移）+ 阵风衰减 + 钩子 ---------- */
{
  const snowMats=[snow1.material,snow2.material],rainMats=[rainMat,rain2Mat];
  const _w=new THREE.Vector2();
  tickers.push((t,dt)=>{
    wind.gust*=Math.exp(-dt*0.55);                 // 阵风指数回落（半衰 ~1.3s）
    const wn=windNow(t);
    _w.set(wn.dx*wn.pow*1.1,wn.dz*wn.pow*1.1);
    for(const m of snowMats)m.uniforms.uWind.value.copy(_w);
    _w.set(wn.dx*wn.pow*1.1,wn.dz*wn.pow*1.1).multiplyScalar(0.22); // 雨受风轻
    for(const m of rainMats)m.uniforms.uWind.value.copy(_w);

  window.__wind=(pow,dx,dz)=>{
    if(pow===undefined){const wn=windNow(window.__clock?window.__clock.elapsedTime:0);
      return{dx:+wn.dx.toFixed(3),dz:+wn.dz.toFixed(3),pow:+wn.pow.toFixed(3),gust:+wind.gust.toFixed(3),
        steamX:+(mhSteams[0]?mhSteams[0].s.position.x:0).toFixed(2)}}
    wind.ov=pow===null?null:{dx:dx??1,dz:dz??0,pow};return wind.ov};
}

/* ---------- R26 时间流逝：小时钟 UI + 车流密度代理 + 钩子 ---------- */
{
  // 右上角毛玻璃小时钟：flow 开启时显示，10s 无交互淡至 0.35
  const chip=document.createElement('div');chip.id='flowclock';

  document.body.appendChild(chip);
  let act=performance.now();
  addEventListener('pointerdown',()=>{act=performance.now()});
  chip.addEventListener('pointerenter',()=>{act=performance.now()});
  tickers.push((t,dt)=>{
    chip.style.display=flowOn?'block':'none';
    if(!flowOn)return;
    const h=Math.floor(gameHour),m=Math.floor((gameHour-h)*60);
    chip.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    chip.style.opacity=(performance.now()-act)/1000<10?0.9:0.35;
  });
  window.__flowClock=()=>chip.textContent;
  // 车流密度代理：每 2.5s 向目标台数靠拢（藏最远/现隐者，相机 30m 内不藏）
  let densT=0;
  tickers.push((t,dt)=>{
    densT-=dt;if(densT>0||!flowOn||!window.__trafficCars)return;densT=2.5;
    const target=Math.round(10*Math.min(piecewise(gameHour,DENSF),1));
    const cars=window.__trafficCars,vis=cars.filter(g=>g.visible&&!g.userData.isBus); // R46：巴士豁免藏匿
    if(vis.length>target){
      let far=null,fd=30;
      for(const g of vis){const d=g.position.distanceTo(camera.position);
        if(d>fd){fd=d;far=g}}
      if(far)far.visible=false}
    else if(vis.length<target){
      const hid=cars.find(g=>!g.visible);if(hid)hid.visible=true}
  });
  window.__flow=(v)=>{
    if(v===undefined)return{on:flowOn,gameHour:+gameHour.toFixed(2),rate:flowRate,
      density:+piecewise(gameHour,DENSF).toFixed(2),clock:chip.textContent,
      active:window.__trafficCars?window.__trafficCars.filter(g=>g.visible).length:null};
    flowOn=!!v;if(v)gameHour=phaseHour(phase);
    if(window.__wxSync)window.__wxSync();return{on:flowOn}};
  window.__setGameHour=h=>{gameHour=((h%24)+24)%24};   // 验收/调试：跳时刻
}

/* ---------- R27 河面动态：涟漪环（雨天）+ 岸灯倒影拉丝 + 波纹 ticker ---------- */
{
  // 1) 雨点涟漪环：24 实例单 draw，雨天生成-扩散-消失
  const ringTex=texCanvas(64,64,(g)=>{g.strokeStyle='rgba(255,255,255,0.9)';g.lineWidth=3;
    g.shadowColor='#fff';g.shadowBlur=4;g.beginPath();g.arc(32,32,22,0,6.284);g.stroke()});
  const ripple=new THREE.InstancedMesh(new THREE.PlaneGeometry(1,1),
    new THREE.MeshBasicMaterial({map:ringTex,transparent:true,depthWrite:false,
      blending:THREE.AdditiveBlending,color:0xffffff,opacity:0.6}),24);
  ripple.renderOrder=3;ripple.visible=false;world.add(ripple);   // 平铺旋转由实例矩阵负责
  {const M=new THREE.Matrix4(),Q=new THREE.Quaternion()
     .setFromEuler(new THREE.Euler(-Math.PI/2,0,0)),P=new THREE.Vector3(),S=new THREE.Vector3(1,1,1);
   for(let i=0;i<24;i++){M.compose(P,Q,S);ripple.setMatrixAt(i,M);
     ripple.setColorAt(i,new THREE.Color(0,0,0))}
   ripple.instanceMatrix.needsUpdate=true;ripple.instanceColor.needsUpdate=true}
  const rps=[];for(let i=0;i<24;i++)rps.push({x:rr(83.5,98.5),z:rr(-100,100),t:rnd(),sp:rr(0.5,0.9)});
  const rq=new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI/2,0,0));
  // 2) 倒影拉丝：渐变贴图平面，x 抖动+风偏，昼间淡出
  const streakTex=texCanvas(64,256,(g)=>{const im=g.createImageData(64,256);
    for(let y=0;y<256;y++){const v=1-y/256,fy=Math.sin(Math.PI*Math.min(1,y/256*1.15))*0.85;
      for(let x=0;x<64;x++){const fx=Math.exp(-(((x-32)/14)**2));const a=255*fy*fx*(0.35+0.65*v);
        const o=(y*64+x)*4;im.data[o]=255;im.data[o+1]=250;im.data[o+2]=230;im.data[o+3]=a}}
    g.putImageData(im,0,0)});
  const streaks=[];
  function bankLight(x,z,lz,len){   // 河畔小灯（R37 前置）：灯杆+光球+昼灭+水面拉丝
    world.add(CYL(0.03,0.05,1.0,0x39404c,x,0.5,z,{o:0.01,seg:8}));
    const bm=new THREE.MeshBasicMaterial({color:0xd8f2e8});bm.color.multiplyScalar(1.4);
    const ball=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8),bm);ball.position.set(x,1.08,z);world.add(ball);
    dayFade(e=>{bm.color.setHex(0xd8f2e8).multiplyScalar(1.4*(1-0.85*e))});
    const m=new THREE.MeshBasicMaterial({map:streakTex,transparent:true,opacity:0.32,
      depthWrite:false,blending:THREE.AdditiveBlending,color:0xbef2dc});
    const p=new THREE.Mesh(new THREE.PlaneGeometry(1.0,len),m);
    p.rotation.x=-Math.PI/2;p.position.set(x,0.02,(z+lz)/2);p.renderOrder=4;world.add(p);
    streaks.push({m,p,x,op:0.32})}

    const m=new THREE.MeshBasicMaterial({map:streakTex,transparent:true,opacity:0.3,
      depthWrite:false,blending:THREE.AdditiveBlending,color:0xffe6b8});
    const p=new THREE.Mesh(new THREE.PlaneGeometry(1.15,26),m);
    p.rotation.x=-Math.PI/2;p.position.set(lx,0.02,-9.2);p.renderOrder=4;world.add(p);
    streaks.push({m,p,x:lx,op:0.3})});
  bankLight(83.8,-30,0,18);bankLight(99.2,30,0,18);
  // 3) ticker：波纹时间/涟漪更新/拉丝抖动
  const _rc=new THREE.Color(),_rm=new THREE.Matrix4();
  tickers.push((t,dt)=>{
    const sh=window.__riverMat&&window.__riverMat.userData.shader;
    if(sh)sh.uniforms.uTime.value=t;
    const rainE=precip!=='snow'?1-weatherBlend:0;
    ripple.visible=rainE>0.05;
    if(ripple.visible){
      rps.forEach((r,i)=>{r.t+=dt*r.sp*(0.5+rainE);
        if(r.t>1){r.t=0;r.x=rr(83.5,98.5);r.z=rr(-100,100)}
        const sc=0.25+r.t*2.3;
        _rm.compose(new THREE.Vector3(r.x,0.024,r.z),rq,new THREE.Vector3(sc,sc,1));
        ripple.setMatrixAt(i,_rm);
        ripple.setColorAt(i,_rc.setScalar((1-r.t)*0.55*rainE))});
      ripple.instanceMatrix.needsUpdate=true;ripple.instanceColor.needsUpdate=true}
    const wn=windNow(t);
    streaks.forEach((st,i)=>{
      st.p.position.x=st.x+Math.sin(t*1.15+i*1.71)*0.22+wn.dx*wn.pow*0.6;
      st.m.opacity=st.op*(1-0.06*Math.sin(t*2.1+i*0.9))*(1-dayE)});
  });
  window.__river=()=>({ripples:ripple.visible?24:0,rainE:+(precip!=='snow'?1-weatherBlend:0).toFixed(2),
    streaks:streaks.length,streakOp:+streaks[0].m.opacity.toFixed(3),
    wave:!!(window.__riverMat&&window.__riverMat.userData.shader)});
}

/* ---------- R28 雪的动态积累：增厚/消融 + 主干道车辙 + 屋顶雪滑落 ---------- */
{
  let depth=1,fallCount=0;
  // 车辙：主干 4 路（±16/48 环线）×双侧车道 8 条暗带，透明度∝积雪增厚（被碾压的雪道）
  const rutM=new THREE.MeshBasicMaterial({color:0x070a10,transparent:true,opacity:0,depthWrite:false});
  [[-16,'v'],[48,'v'],[-16,'h'],[48,'h']].forEach(([a,dir])=>{
    for(const lane of[-2,2]){
      const p=new THREE.Mesh(new THREE.PlaneGeometry(dir==='v'?0.55:204,dir==='v'?204:0.55),rutM);
      p.rotation.x=-Math.PI/2;p.renderOrder=2;
      p.position.set(dir==='v'?a+lane:0,0.075,dir==='v'?0:a+lane);
      world.add(p)}});
  // 屋顶雪滑落：雪团坠落+落地雪雾（R31 音景预留 falls 事件计数）
  let fallT=rr(14,26),lump=null,lumpV=0;
  const puffs=[];
  for(let i=0;i<6;i++){const m=new THREE.SpriteMaterial({map:glowTex,color:0xcfe0ee,
    transparent:true,opacity:0,depthWrite:false});
    const s=new THREE.Sprite(m);s.visible=false;world.add(s);puffs.push({s,t:1})}
  tickers.push((t,dt)=>{
    // 厚度：持续降雪 5 现实分钟至 1.15；雨快融/昼慢融
    if(precip==='snow')depth=Math.min(1.15,depth+0.0005*dt);
    else if(precip==='rain')depth=Math.max(1,depth-0.0022*dt);
    else if(dayE>0.5)depth=Math.max(1,depth-0.0008*dt);
    const dn=(depth-1)/0.15;
    // 应用：extraCaps 懒快照 scale.y、雪堆 IM 整体、车辙、地面雪层增白
    for(const m of extraCaps){if(m.userData._sy0===undefined)m.userData._sy0=m.scale.y;
      m.scale.y=m.userData._sy0*depth}
    if(window.__pileIM)window.__pileIM.scale.y=depth;
    rutM.opacity=0.38*dn;
    {const wb=weatherBlend,de=wb*wb*(3-2*wb);           // 与天气 ticker 同式，覆写雪层透明度
     dusting.material.opacity=0.32*de+0.06*dn}
    // 屋顶雪滑落
    if(precip==='snow'&&depth>1.02){fallT-=dt;
      if(fallT<=0&&!lump){fallT=rr(30,60);
        const r=pick(rooftops);
        if(r){lump=new THREE.Mesh(new THREE.SphereGeometry(rr(0.16,0.26),8,6),snowMat);
          lump.position.set(r[0]+rr(-3,3),r[1],r[2]+rr(-3,3));world.add(lump);lumpV=0}}}
    if(lump){lumpV+=11*dt;lump.position.y-=lumpV*dt;
      if(lump.position.y<=0.16){const lx=lump.position.x,lz=lump.position.z;
        world.remove(lump);lump=null;lumpV=0;fallCount++;
        for(const p of puffs){if(p.t<1)continue;
          p.t=0;p.s.visible=true;p.s.position.set(lx+rr(-0.5,0.5),0.22,lz+rr(-0.5,0.5))}}}
    for(const p of puffs){if(p.t>=1)continue;p.t+=dt/1.2;
      const k=Math.min(p.t,1);p.s.material.opacity=0.42*(1-k);
      p.s.scale.setScalar(0.5+k*1.4);p.s.position.y+=dt*0.35;
      if(p.t>=1)p.s.visible=false}
  });
  window.__snowDepth=v=>{if(v!==undefined)depth=clamp(v,1,1.15);
    return{depth:+depth.toFixed(3),ruts:+rutM.opacity.toFixed(3),falls:fallCount,
      caps:extraCaps.length}};
}

      reg(`resi-${bi}b`,`${RN[bi*2+1]}アパート`,'公寓',t1,bx+7.5,bz,10,16,14,[bx-8.5,4.5,bz],[bx+7.5,4.5,bz])}});

/* ---------- R30 拍照模式：2.35:1 黑边 + 三分网格 + 快门下载（P 进出/G 网格/F 快门） ---------- */
{
  const mk=(css)=>{const d=document.createElement('div');d.style.cssText=css;document.body.appendChild(d);return d};
  const barH=()=>Math.max(0,(innerHeight-innerWidth/2.35)/2);
  const bT=mk('position:fixed;left:0;top:0;width:100%;height:0;background:#000;z-index:20;transition:height .5s ease;pointer-events:none');
  const bB=mk('position:fixed;left:0;bottom:0;width:100%;height:0;background:#000;z-index:20;transition:height .5s ease;pointer-events:none');
  const grid=mk('position:fixed;left:0;top:0;width:100%;height:100%;z-index:21;pointer-events:none;opacity:0;transition:opacity .4s;'
    +'background:linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.15)) 0 calc(33.33% - .5px)/100% 1px no-repeat,'
    +'linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.15)) 0 calc(66.66% - .5px)/100% 1px no-repeat,'
    +'linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.15)) calc(33.33% - .5px) 0/1px 100% no-repeat,'
    +'linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.15)) calc(66.66% - .5px) 0/1px 100% no-repeat');
  const flash=mk('position:fixed;inset:0;background:#fff;opacity:0;z-index:22;pointer-events:none;transition:opacity .25s');
  const btn=mk('position:fixed;right:22px;bottom:24px;width:46px;height:46px;border-radius:50%;z-index:23;display:none;'
    +'background:rgba(10,15,28,.6);border:2px solid rgba(255,255,255,.75);cursor:pointer;backdrop-filter:blur(6px)');
  btn.title='快门（F）';
  const uiBits=['wxbar','flowclock','focusCard'];
  let on=false,gridOn=true;
  function photoSet(v){on=v;
    const h=on?barH()+'px':'0px';bT.style.height=h;bB.style.height=h;
    grid.style.top=h;grid.style.height=`calc(100% - ${2*barH()}px)`;
    grid.style.opacity=on&&gridOn?1:0;
    btn.style.display=on?'block':'none';
    flash.style.transition='none';flash.style.opacity=0;flash.style.transition='opacity .25s';
    for(const id of uiBits){const el=document.getElementById(id);
      if(el)el.style.visibility=on?'hidden':'visible'}
    if(on)flash.style.opacity=0;
    if(window.__cineSync)window.__cineSync(on);   // R57：DOF/颗粒/分级随拍照模式插拔
  }
  function shoot(){if(!on)return;
    flash.style.transition='none';flash.style.opacity=0.85;
    requestAnimationFrame(()=>{flash.style.transition='opacity .25s';flash.style.opacity=0});
    const d=new Date(),nm='city-night-'+String(d.getHours()).padStart(2,'0')
      +String(d.getMinutes()).padStart(2,'0')+String(d.getSeconds()).padStart(2,'0')+'.png';
    window.__shotName=nm;window.__pendingShot=true;
  }
  function photoToggle(){photoSet(!on)}
  btn.onclick=()=>shoot();
  addEventListener('keydown',e=>{
    if(e.code==='KeyP'){photoSet(!on)}
    else if(e.code==='KeyG'&&on){gridOn=!gridOn;grid.style.opacity=gridOn?1:0}
    else if(e.code==='KeyF'&&on){shoot()}
    else if(e.code==='KeyC'&&on){if(window.__cineGrain)window.__cineGrain()}   // R57：胶片颗粒开关（限拍照模式）
    else if(e.code==='Escape'&&on){photoSet(false)}});
  addEventListener('resize',()=>{if(on){const h=barH()+'px';bT.style.height=h;bB.style.height=h}});
  window.__photo=v=>{if(v===undefined)return{on,grid:gridOn,bar:barH()};
    photoSet(!!v);return{on}};
  window.__shutter=()=>{shoot();return true};
  window.__shotInfo=()=>({name:window.__shotName||null,bytes:window.__lastShotBytes||0});
  window.__shotCb=s=>{window.__lastShotBytes=s};
}

/* ---------- R31 音景：WebAudio 全程序化合成（默认静音，控制条 🔊 开启） ----------
   层：city 棕噪底噪 / wind 粉噪扫频(随 R24 风力) / rain 白噪+瞬态雨滴 / train 轮轨(随 R22 列车)
   事件：thunder(strike 延迟轰鸣) / door(叮咚) / snowpuff(R28 雪坠噗) —— 全部常驻节点复用 */
{
  let ac=null,master=null,sndOn=false;
  const layers={city:0,wind:0,rain:0,train:0,thunder:0};
  let windG,windF,rainG,cityG,trainG,trainMod,thunderG,lastThun=0;
  let dropAcc=0,doorPhPrev='closed',fallsPrev=0;
  const thunderQ=[];   // 延迟轰鸣队列 {at}
  window.__audioCore=()=>({ac:()=>ac,master:()=>master,cityG:()=>cityG,layers,
    noiseBuf:()=>noiseBuf,sndOn:()=>sndOn});   // R52：五新层挂接 exposed（块级闭包）
  function noiseBuf(type,sec){
    const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
    let l0=0,l1=0,l2=0,brown=0;
    for(let i=0;i<n;i++){const w=Math.random()*2-1;
      if(type==='white')d[i]=w*0.6;
      else if(type==='brown'){brown=(brown+0.02*w)/1.02;d[i]=brown*4.5}
      else{l0=0.99765*l0+w*0.0990460;l1=0.96300*l1+w*0.2965164;l2=0.57000*l2+w*1.0526913;
        d[i]=(l0+l1+l2+w*0.1848)*0.15}}   // 粉噪 Paul Kellet
    return b}
  function loopSrc(buf,dest){const s=ac.createBufferSource();s.buffer=buf;s.loop=true;s.connect(dest);s.start();return s}
  function initAudio(){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
    const pk=noiseBuf('pink',4),wh=noiseBuf('white',2),bn=noiseBuf('brown',4),dr=noiseBuf('white',0.03);
    window.__dropBuf=dr;
    cityG=ac.createGain();cityG.gain.value=0;
    {const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=220;
     loopSrc(bn,f);f.connect(cityG);cityG.connect(master)}
    windG=ac.createGain();windG.gain.value=0;windF=ac.createBiquadFilter();
    windF.type='lowpass';windF.frequency.value=500;windF.Q.value=0.7;
    {const s=ac.createBufferSource();s.buffer=pk;s.loop=true;s.connect(windF);windF.connect(windG);windG.connect(master);s.start()}
    rainG=ac.createGain();rainG.gain.value=0;
    {const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=1200;
     const s=ac.createBufferSource();s.buffer=wh;s.loop=true;s.connect(f);f.connect(rainG);rainG.connect(master);s.start()}
    trainG=ac.createGain();trainG.gain.value=0;trainMod=ac.createGain();
    {const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=300;f.Q.value=0.6;
     const s=ac.createBufferSource();s.buffer=bn;s.loop=true;s.connect(f);f.connect(trainMod);trainMod.connect(trainG);trainG.connect(master);s.start()}
    window.__thunderSnd=()=>{if(!ac||!sndOn)return;
      thunderQ.push({at:ac.currentTime+0.3+Math.random()*1.2})};
  }
  function thunderBurst(at){
    const src=ac.createBufferSource();src.buffer=noiseBuf('brown',3);
    const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=120;
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(0.55,at+0.12);
    g.gain.exponentialRampToValueAtTime(0.0001,at+2.6);
    src.connect(f);f.connect(g);g.connect(master);src.start(at);
    lastThun=0.55}
  function chime(){if(!ac)return;const t=ac.currentTime;
    [[1318,0],[1046,0.14]].forEach(([fr,dl])=>{
      const o=ac.createOscillator();o.type='sine';o.frequency.value=fr;
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t+dl);
      g.gain.exponentialRampToValueAtTime(0.06,t+dl+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dl+0.35);
      o.connect(g);g.connect(master);o.start(t+dl);o.stop(t+dl+0.4)})}
  function puff(){if(!ac)return;const t=ac.currentTime;
    const src=ac.createBufferSource();src.buffer=noiseBuf('brown',0.3);
    const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=200;
    const g=ac.createGain();g.gain.setValueAtTime(0.18,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    src.connect(f);f.connect(g);g.connect(master);src.start(t)}
  window.__sndToggle=()=>{
    if(!ac)initAudio();
    if(ac.state==='suspended')ac.resume();
    sndOn=!sndOn;
    master.gain.setTargetAtTime(sndOn?0.32:0,ac.currentTime,0.3);
    if(!sndOn)for(const k2 in layers)layers[k2]=0;   // 静音时层读数归零（master 已 0）
    if(window.__sndLabel)window.__sndLabel(sndOn);
    return sndOn};
  tickers.push((t,dt)=>{
    if(!ac||!sndOn||ac.state!=='running')return;
    const k=Math.min(1,dt*3);
    // 风：粉噪扫频随 R24 风力
    const wn=windNow(t);
    windF.frequency.value=420+420*wn.pow;
    layers.wind=0.14+0.30*wn.pow;windG.gain.value+=(layers.wind-windG.gain.value)*k;
    // 雨：白噪垫底+瞬态雨滴（密度∝雨强）
    const rainE=precip!=='snow'?1-weatherBlend:0;
    layers.rain=0.30*rainE;rainG.gain.value+=(layers.rain-rainG.gain.value)*k;
    if(rainE>0.3){dropAcc+=dt*rainE*5;
      while(dropAcc>1){dropAcc-=1;
        const s=ac.createBufferSource();s.buffer=window.__dropBuf;
        const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=3000+Math.random()*3000;f.Q.value=2;
        const g=ac.createGain();const at=ac.currentTime;
        g.gain.setValueAtTime(0.05+Math.random()*0.06,at);
        g.gain.exponentialRampToValueAtTime(0.0001,at+0.04);
        s.connect(f);f.connect(g);g.connect(master);s.start(at)}}
    // 列车：轮轨随 R22 速度，8Hz 幅度调制
    const tr=window.__train?window.__train():null;
    layers.train=(tr&&tr.state!=='hidden')?Math.min(0.2,tr.v*0.03):0;
    trainG.gain.value+=(layers.train-trainG.gain.value)*k;
    trainMod.gain.value=0.6+0.4*Math.sin(t*Math.PI*2*8);
    // 城市底噪
    layers.city=(flowOn&&gameHour>=2&&gameHour<4)?0.03:0.05;   // R48 预留：凌晨底噪 ×0.6（R52 接线）
    cityG.gain.value+=(layers.city-cityG.gain.value)*k;
    // 雷轰鸣队列
    while(thunderQ.length&&thunderQ[0].at<=ac.currentTime){thunderQ.shift();thunderBurst(ac.currentTime)}
    lastThun*=Math.exp(-dt*0.8);layers.thunder=lastThun;
    // 便利店门铃（开门瞬间叮咚）+ 雪坠噗
    const di=window.__doorInfo?window.__doorInfo():null;
    if(di&&di.ph==='opening'&&doorPhPrev!=='opening')chime();
    doorPhPrev=di?di.ph:'closed';
    const sd=window.__snowDepth?window.__snowDepth():null;
    if(sd&&sd.falls>fallsPrev)puff();
    fallsPrev=sd?sd.falls:0;
  });
  window.__sound=()=>({on:sndOn,state:ac?ac.state:'none',
    layers:Object.fromEntries(Object.entries(layers).map(([k2,v])=>[k2,+v.toFixed(3)]))});
}

/* ---------- R32 移动端与触控：双击聚焦 + 帧率监视自动降档（单次不回弹） ---------- */
{
  // 双击聚焦：300ms/30px 内两次抬指 → __pickAt 直调（不走合成事件：OrbitControls setPointerCapture
  // 对合成 pointerId 会抛异常并中断同事件的后续监听器）
  let lTT=0,lTX=0,lTY=0;
  renderer.domElement.addEventListener('pointerup',e=>{
    const now=performance.now();
    if(now-lTT<300&&Math.hypot(e.clientX-lTX,e.clientY-lTY)<30){
      lTT=0;
      const id=window.__pickAt?window.__pickAt(e.clientX,e.clientY):null;
      if(id)window.__focus(id);else window.__unfocus();
    }else{lTT=now;lTX=e.clientX;lTY=e.clientY}
  });
  window.__reflector=reflector;   // 降档断言/调试句柄
  // 自动降档：触屏 UA 直接 L2；桌面连续 3s 均帧率 <35 升一级（L0→L1→L2→L3，不回弹）；?q=N 手动锁定
  let fr=0,ft=0,lowCnt=0;
  const tip=document.createElement('div');
  tip.style.cssText='position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:12;'
    +'padding:7px 14px;border-radius:11px;background:rgba(10,15,28,.7);backdrop-filter:blur(8px);'
    +'border:1px solid rgba(160,190,230,.24);color:#cfdcea;font:12px "Yu Gothic","Meiryo",sans-serif;'
    +'opacity:0;transition:opacity .5s;pointer-events:none;letter-spacing:1px';
  tip.textContent='性能模式';document.body.appendChild(tip);
  let perfLevel=0,autoLevel=true;
  function applyLevel(l){
    perfLevel=clamp(l,0,3);
    if(perfLevel===0){
      renderer.setPixelRatio(Math.min(devicePixelRatio,1.75)||1.75);
      snow1.geometry.setDrawRange(0,Infinity);snow2.geometry.setDrawRange(0,Infinity);
      reflector.visible=true;bloom.setSize(innerWidth,innerHeight);
    }else{
      if(perfLevel>=1){snow1.geometry.setDrawRange(0,1200);snow2.geometry.setDrawRange(0,400)}
      if(perfLevel>=2){renderer.setPixelRatio(Math.min(devicePixelRatio,1.25)||1.25);reflector.visible=false}
      if(perfLevel>=3)bloom.setSize(Math.round(innerWidth/2),Math.round(innerHeight/2));
    }
    if(window.__cineLevel)window.__cineLevel(l);   // R57：DOF/颗粒随降档实时联动
    tip.style.opacity=perfLevel>0?0.9:0;setTimeout(()=>tip.style.opacity=0,4000);
  }
  window.__perf=()=>({fps:ft>0?Math.round(fr/ft):0,level:perfLevel,dpr:+renderer.getPixelRatio().toFixed(2)});
  window.__perfLevel=l=>{autoLevel=false;applyLevel(clamp(l,0,3))};
  window.__perfDegrade=()=>{autoLevel=false;applyLevel(3)};   // 兼容 R32 旧钩子（=最高降档）
  if(/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent))applyLevel(2);
  {const q=params.get('q');if(q!==null){autoLevel=false;applyLevel(clamp(parseInt(q)||0,0,3))}}
  tickers.push((t,dt)=>{
    fr++;ft+=dt;
    if(ft>=1){const fps=fr/ft;fr=0;ft=0;
      if(autoLevel&&perfLevel<3){if(fps<35)lowCnt++;else lowCnt=0;
        if(lowCnt>=3){applyLevel(perfLevel+1);lowCnt=0}}}
  });
}

/* ---------- R41 街猫系统：5 只程序化猫 + 状态机 + 暖点/雷雨响应 + 名片彩蛋 ---------- */
{
  const LANES=[-80,-48,-16,16,48,80];                       // 路心线（车道中心=路心±2，日本左侧通行）
  const laneDist=(x,z)=>{let m=1e9;                          // 到最近车道中心线的距离
    for(const r of LANES){m=Math.min(m,Math.abs(x-(r-2)),Math.abs(x-(r+2)),Math.abs(z-(r-2)),Math.abs(z-(r+2)))}
    return m};
  const catR=(a,b)=>a+Math.random()*(b-a);                  // 运行期独立随机（不触主 rnd 流，防下游生成位移）
  // 领地锚点（硬断言：离最近车道中心 ≥5m）与雷雨藏点；河堤锚点取东岸——西岸步道距 x=80 道东车道仅 ~1.5m 违距
  const CATS=[
    {id:'cat-tama', name:'タマ',  fur:0x8a6f52, ax:-5.5,  az:-8.5, hx:-3.8,  hz:-7.6},
    {id:'cat-kuro', name:'クロ',  fur:0x23252b, ax:29,    az:-57,  hx:30.6,  hz:-58.4},
    {id:'cat-mike', name:'ミケ',  fur:0xe4ddcf, patch:0xc4703f, ax:30, az:61, hx:31.4, hz:62.4},
    {id:'cat-shiro',name:'シロ',  fur:0xd9dde2, ax:33,    az:-61,  hx:34.4,  hz:-60.2},
    {id:'cat-cha',  name:'チャ',  fur:0xa8845c, ax:100.8, az:0,    hx:101.5, hz:-1.2}];
  const WARM=[{x:-1.2,z:3.9,t:'自动门旁'},{x:32,z:-61.5,t:'站亭檐下'},{x:28,z:59,t:'园灯下'}];
  const HABIT={
    'cat-tama':'店先の定員。自動ドアのそばが、いちばんあたたかい。',
    'cat-kuro':'駅前の番猫。終電の音で、必ず目を覚ます。',
    'cat-mike':'公園の三毛姉さん。雪の日も、平気な顔。',
    'cat-shiro':'北の空き地の住人。塔の灯りを見るのが日課。',
    'cat-cha':'川の向こうの猫。波の音に、耳を澄ます。'};
  let laneMin=1e9;                                           // 锚点/藏点安全断言（≥5m）
  for(const c of CATS){const d1=laneDist(c.ax,c.az),d2=laneDist(c.hx,c.hz);
    laneMin=Math.min(laneMin,d1);
    if(d1<5)__err.push('R41 锚点违距: '+c.name+' '+d1.toFixed(1));

    const body=new THREE.SphereGeometry(1,10,8);body.scale(0.19,0.165,0.30);body.translate(0,0.185,0);parts.push(body);
    const head=new THREE.SphereGeometry(0.125,10,8);head.translate(0,0.31,0.26);parts.push(head);
    for(const s of[-1,1]){const ear=new THREE.ConeGeometry(0.048,0.085,6);
      ear.translate(0.055*s,0.435,0.24);parts.push(ear)}
    for(const s of[-1,1])for(const f of[-1,1]){
      const leg=new THREE.CylinderGeometry(0.032,0.026,0.15,6);leg.translate(0.085*s,0.075,0.16*f);parts.push(leg)}
    const bodyGeo=mergeGeometries(parts);
    const bodyM=new THREE.Mesh(bodyGeo,fur);bodyM.castShadow=false;g.add(bodyM); // 猫影在 ±110m 阴影相机下<1 纹素，关投影省 8 shadow draws（29→21）守 R41 预算
    const ol=new THREE.Mesh(bodyGeo,outlineMat);ol.scale.setScalar(1.07);bodyM.add(ol); // 描边壳随姿态
    if(c.patch){const pg=new THREE.SphereGeometry(1,8,6);pg.scale(0.155,0.105,0.23);pg.translate(0,0.30,-0.03);

    const tailP=new THREE.Group();tailP.position.set(0,0.235,-0.28);bodyM.add(tailP); // 挂 bodyM 继承蜷缩/端坐姿态
    const tg=new THREE.CylinderGeometry(0.012,0.03,0.32,6);tg.translate(0,0.16,0);

    g.position.set(c.ax,0,c.az);g.rotation.y=catR(0,6.28);

    pickM.position.set(c.ax,0.27,c.az);world.add(pickM);
    const entry=window.__registerFocus({id:c.id,name:c.name,type:'猫',text:HABIT[c.id],m:pickM,

    return{cfg:c,g,bodyM,tailP,pickM,entry,
      st:'sit',t:catR(5,12),tx:c.ax,tz:c.az,ph:catR(0,6.28),chk:catR(2,5)}}
  const cats=CATS.map(buildCat);
  let strikeN=0,seenStrike=0;                                // 雷击事件 tap（strike() 调 __thunderSnd，包装计数不动原函数）
  {const prev=window.__thunderSnd;
   window.__thunderSnd=()=>{if(prev)prev();strikeN++}}
  function chooseNext(c){
    const mul=window.__catNightMul||1,r=Math.random();

      c.tx=c.cfg.ax;c.tz=c.cfg.az}
    else{c.tx=c.g.position.x;c.tz=c.g.position.z}}
  tickers.push((t,dt)=>{
    const de=window.__time?window.__time().dayE:0;           // 夜瞳：昼暗夜亮（上限压在 bloom 阈值下）
    eyeInt=0.65-0.60*Math.min(1,de*1.3);eyeMat.emissiveIntensity=eyeInt;
    if(strikeN>seenStrike){seenStrike=strikeN;               // 雷 → 全员奔藏点
      for(const c of cats){c.st='hide';c.t=catR(45,60);c.tx=c.cfg.hx;c.tz=c.cfg.hz}}
    const depth=window.__snowDepth?window.__snowDepth().depth:1;
    for(const c of cats){
      c.chk-=dt;
      if(c.chk<=0){c.chk=catR(3,6);
        if(c.st!=='hide'){
          if(depth>1.05&&c.st!=='warmth'){                   // 深雪 → 就近暖点（≤40m）或原地蜷缩
            c.st='warmth';let bw=null,bd=40;
            for(const w of WARM){const d=Math.hypot(w.x-c.g.position.x,w.z-c.g.position.z);
              if(d<bd){bd=d;bw=w}}
            if(bw){const off=[[0,0],[0.7,0.3],[-0.5,0.6],[0.4,-0.6],[-0.6,-0.4]][cats.indexOf(c)];
              c.tx=bw.x+off[0];c.tz=bw.z+off[1]}else{c.tx=c.cfg.ax+0.4;c.tz=c.cfg.az} // 暖点散布防扎堆
            c.t=catR(20,40)}
          else if(depth<=1.05&&c.st==='warmth'){c.st='sit';c.t=catR(4,9)}}}
      c.t-=dt;
      const dx=c.tx-c.g.position.x,dz=c.tz-c.g.position.z,dist=Math.hypot(dx,dz);
      const mv=c.st==='walk'||c.st==='hide'||c.st==='warmth';
      if(mv&&dist>0.15){
        const spd=c.st==='hide'?2.0:c.st==='warmth'?1.4:1.2;
        c.g.position.x+=dx/dist*Math.min(spd*dt,dist);
        c.g.position.z+=dz/dist*Math.min(spd*dt,dist);
        c.g.rotation.y=Math.atan2(dx,dz);
        c.g.position.y=Math.abs(Math.sin(t*9+c.ph))*0.02}   // walk bob
      else c.g.position.y=0;
      if(c.t<=0){
        if(c.st==='hide'){c.st='sit';c.t=catR(4,9)}
        else if(c.st==='warmth')c.t=catR(15,30);
        else chooseNext(c)}
      if(dist<=0.15&&c.st==='walk'){c.st='sit';c.t=catR(3,8)}
      const b=c.bodyM,s=c.st;                                // 姿态
      if(s==='curl'||s==='hide'||(s==='warmth'&&dist<=0.2)){
        const br=1+0.015*Math.sin(t*2.2+c.ph);               // 蜷睡呼吸
        b.scale.set(1.12*br,0.70,0.95);b.rotation.x=0;b.position.y=-0.052;
        c.tailP.visible=false}                               // 蜷睡收尾（藏身下）
      else if(s==='sit'){b.scale.set(1,1,1);b.rotation.x=-0.28;b.position.y=0.02;
        c.tailP.visible=true;c.tailP.rotation.set(0.25,0,1.05)}
      else if(s==='groom'){b.scale.set(1,1,1);
        b.rotation.x=-0.12+Math.sin(t*8+c.ph)*0.13;b.position.y=0.01;
        c.tailP.rotation.set(0,0,0.4+Math.sin(t*3)*0.2)}
      else{b.scale.set(1,1,1);b.rotation.x=0;b.position.y=0;
        c.tailP.rotation.set(0,0,Math.sin(t*7.54+c.ph)*0.5)} // 1.2Hz 尾摆
      c.entry.cam.set(c.g.position.x+1.5,1.0,c.g.position.z+2.0);  // 名片机位跟随活体
      c.entry.look.set(c.g.position.x,0.32,c.g.position.z);
      c.pickM.position.set(c.g.position.x,0.27,c.g.position.z);
    }});
  window.__cats=()=>cats.map(c=>({id:c.cfg.id,name:c.cfg.name,state:c.st,
    x:+c.g.position.x.toFixed(2),z:+c.g.position.z.toFixed(2)}));
  window.__catNightMul=1;                                    // R48 深夜编排接入点（walk 概率倍率）
  window.__catsInfo={anchorsOk:!__err.some(e=>String(e).indexOf('R41')===0),
    laneMin:+laneMin.toFixed(2),warmSpots:WARM.length,cats:cats.length,
    get eyes(){return +eyeInt.toFixed(3)},get strikes(){return strikeN}};
}

{

  const capMesh=new THREE.Mesh(mergeGeometries(stoolCaps),snowMat);yataiG.add(capMesh);extraCaps.push(capMesh);

  yataiG.add(new THREE.Mesh(mergeGeometries(sp),toon(0x54402b)));

  const norenT=texCanvas(64,96,(g)=>{g.fillStyle='#b0342c';g.fillRect(0,0,64,96);
    g.fillStyle='#f2e6c8';g.beginPath();g.arc(32,46,20,0,6.283);g.fill();
    g.fillStyle='#b0342c';g.font='bold 26px "Yu Gothic","Meiryo",serif';

  const norenM=new THREE.MeshBasicMaterial({map:norenT,transparent:true,side:THREE.FrontSide}); // FrontSide：DoubleSide+透明在 r160 每片拆 2 draws（实测），暖帘仅正面可观
  norenM.depthWrite=true;
  const strips=[];

    yataiG.add(m);strips.push(m)}
  // —— 灯笼 ×2（夜亮昼灭在本轮 ticker 统一写色，注册点自带错落；不进 dayFade 免双写冲突）
  const lantMs=[];
  [['らーめん',-0.95],['たかし',0.95]].forEach(([txt,lx],i)=>{
    const t=texCanvas(64,160,(g)=>{g.fillStyle='#f2e6c8';g.fillRect(0,0,64,160);
      g.fillStyle='#c0392b';g.fillRect(0,0,64,12);g.fillRect(0,148,64,12);
      g.fillStyle='#8f2f2a';g.font='bold 30px "Yu Gothic","Meiryo",serif';

    c.position.set(lx,2.06,0.82);yataiG.add(c);lantMs.push({m,base:1.3-i*0.08})});
  // —— 菜单立牌
  const menuT=texCanvas(128,224,(g)=>{g.fillStyle='#4a3826';g.fillRect(0,0,128,224);

  menu.position.set(-1.35,0.45,0.9);menu.rotation.set(-0.08,0.55,0);yataiG.add(menu);
  // —— 蒸汽 ×3：真实注册进 mhSteams（位置/漂移公式全复用），营业闸由本轮 ticker 乘 cur（注册序在后=后写生效）
  const steamBase=[];
  for(let i=0;i<3;i++){

  // —— 营业态：非 flow 全亮（红线⑤）；flow 下 18-2 点营业、2-7 收摊（灯灭+汽停+暖帘收，1.2s 过渡）
  let cur=1;
  tickers.push((t,dt)=>{
    const want=(!flowOn||gameHour>=18||gameHour<2)?1:0;
    if(cur!==want){cur+=Math.sign(want-cur)*Math.min(dt/1.2,Math.abs(cur-want));
      if(cur<0)cur=0;if(cur>1)cur=1}
    const de=window.__time?window.__time().dayE:0;
    lantMs.forEach(l=>l.m.color.setScalar(l.base*cur*(1-0.92*de)));
    norenM.opacity=cur;
    strips.forEach(s=>{s.visible=cur>0.04;
      s.rotation.x=Math.sin(t*1.4+s.userData.ph)*(0.05+0.10*windNow(t).pow)*cur});
    for(const e of steamBase)e.s.material.opacity=Math.min(0.16,e.s.material.opacity*1.6)*cur;

  const capOk=extraCaps.indexOf(roofCap)>=0&&extraCaps.indexOf(capMesh)>=0;
  window.__yatai=()=>({lit:cur>0.5,steam:+cur.toFixed(2),curtain:+cur.toFixed(2),

/* ---------- R43 窗内生活光影：电视蓝闪/暖灯呼吸/窗帘开合/绿植（4 组 InstancedMesh=4 draws） ---------- */
{
  // —— 纹理（纯色块/织物/植物剪影——任何纹理无人形，世界观红线）
  const tvT=texCanvas(64,64,(g)=>{g.fillStyle='#8fb8d8';g.fillRect(0,0,64,64);
    g.fillStyle='rgba(20,40,70,0.5)';for(let y=4;y<64;y+=8)g.fillRect(0,y,64,3);
    g.fillStyle='rgba(255,255,255,0.25)';g.fillRect(8,10,20,3)});
  const warmT=texCanvas(64,64,(g)=>{const r=g.createRadialGradient(32,32,4,32,32,46);
    r.addColorStop(0,'#ffe2b0');r.addColorStop(1,'#a07040');g.fillStyle=r;g.fillRect(0,0,64,64)});
  const curT=texCanvas(64,64,(g)=>{g.fillStyle='#c8b8a0';g.fillRect(0,0,64,64);
    for(let x=0;x<64;x+=10){g.fillStyle='rgba(90,70,50,0.35)';g.fillRect(x,0,4,64)}});
  const plantT=texCanvas(64,64,(g)=>{g.fillStyle='#141c12';g.fillRect(0,0,64,64);
    g.fillStyle='#2e4a28';for(const[lx,ly,r]of[[24,30,12],[40,26,10],[32,40,11],[20,44,8],[44,40,8]]){
      g.beginPath();g.arc(lx,ly,r,0,6.283);g.fill()}
    g.fillStyle='#3a2c20';g.fillRect(24,50,16,10)});
  // —— 候选窗：winPulse 亮窗实例矩阵 → 世界位姿（实例轴与建筑径向 |dot|>0.7 才采，跳过朝向存疑实例）
  const m4=new THREE.Matrix4(),pv=new THREE.Vector3(),pq=new THREE.Quaternion(),ps=new THREE.Vector3();
  const gq=new THREE.Quaternion(),ax=new THREE.Vector3(),nr=new THREE.Vector3();
  const cand=[],byB=new Map();
  for(const b of winPulse){
    if(!b.n)continue;
    const G=b.im.parent;G.getWorldQuaternion(gq);
    const key=G.position.x+','+G.position.z;
    for(let i=0;i<b.n;i++){
      b.im.getMatrixAt(i,m4);m4.decompose(pv,pq,ps);
      const wp=G.localToWorld(pv.clone());
      if(wp.y<1.2)continue;
      ax.set(0,0,1).applyQuaternion(pq).applyQuaternion(gq);ax.y=0;   // 实例轴→世界（先实例后楼体两级变换）
      if(ax.lengthSq()<0.5)continue;ax.normalize();
      nr.copy(wp).sub(G.position);nr.y=0;nr.normalize();
      if(ax.dot(nr)<0.7&&ax.dot(nr)>-0.7)continue;
      if(ax.dot(nr)<0)ax.negate();
      if(!byB.has(key))byB.set(key,[]);
      byB.get(key).push({wp,n:ax.clone()})}}
  // —— 跨 ≥10 栋选 31 扇：楼间轮转各取 2-3 扇
  const usedB=[...byB.keys()].sort(()=>Math.random()-0.5);
  const picked=[];
  for(let r=0;r<4&&picked.length<31;r++){
    for(const k of usedB){const arr=byB.get(k);
      if(arr.length&&picked.length<31){picked.push(arr.shift());if(picked.length>=31)break}}}
  if(picked.length<28)__err.push('R43 候选窗不足: '+picked.length);
  if(new Set(picked.map(p=>p.wp.x.toFixed(0)+','+p.wp.z.toFixed(0))).size<10&&picked.length)
    __err.push('R43 楼栋数不足: '+usedB.length);
  // —— 分组：tv9/warm11/cur7/plant4，4 组 InstancedMesh=4 draws（加色混合叠在亮窗上）
  const GRPDEF=[{tex:tvT,kind:'tv',n:9},{tex:warmT,kind:'warm',n:11},{tex:curT,kind:'cur',n:7},{tex:plantT,kind:'plant',n:4}];
  const Zv=new THREE.Vector3(0,0,1),one=new THREE.Vector3(1,1,1);
  let idx=0;const groups=[];
  for(const gd of GRPDEF){
    const nn=Math.min(gd.n,picked.length-idx);if(nn<=0)break;   // 候选不足护栏
    const mat=new THREE.MeshBasicMaterial({map:gd.tex,transparent:true,opacity:1,
      blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.FrontSide}); // FrontSide：DoubleSide+透明在 r160 每实例 2 draws（R42 同坑），生活层仅 outward 可观
    const im=new THREE.InstancedMesh(new THREE.PlaneGeometry(0.95,0.85),mat,nn);
    im.renderOrder=3;im.name='r43life';
    const inst=[];
    for(let i=0;i<nn;i++){
      const p=picked[(idx+i)%picked.length];
      const q=new THREE.Quaternion().setFromUnitVectors(Zv,p.n);
      im.setMatrixAt(i,new THREE.Matrix4().compose(
        p.wp.clone().addScaledVector(p.n,0.05),q,one));
      inst.push({ph:Math.random()*6.283,b:0.7,tb:0.7,t:Math.random()*2,ch:0,cover:Math.random()})}
    im.instanceMatrix.needsUpdate=true;
    for(let i=0;i<nn;i++)im.setColorAt(i,new THREE.Color(0.7,0.7,0.7));
    im.instanceColor.needsUpdate=true;
    world.add(im);
    groups.push({kind:gd.kind,im,mat,inst,n:nn});idx+=nn}
  // —— 挂级读取（R38）：L2 起动画冻结为静态帧；L3 砍半（cur+plant 隐藏）
  let perfL=0,perfT=0;
  // —— flow 昼夜系数
  const lifeKof=h=>{ // 凌晨 1-5 → 0.1；23-1 与 5-7 线性过渡
    if(h>=23)return Math.max(0.1,1-(h-23)/2);
    if(h<1)return 0.1;
    if(h<5)return 0.1;
    if(h<7)return Math.min(1,0.1+(h-5)/2);
    return 1};
  const TVTINT=[[0.62,0.78,1.0],[0.45,0.9,0.95],[0.9,0.5,0.95]];   // 蓝/青/品红（换台色偏）
  const c=new THREE.Color();
  // 构建帧先跑一遍静态上色（L2 冻结态也有画面）
  tickers.push((t,dt)=>{
    if(t-perfT>1){perfT=t;const pf=window.__perf?window.__perf():null;perfL=pf?pf.level:0}
    const de=window.__time?window.__time().dayE:0;
    const dayK=1-0.85*Math.min(1,de);
    const lifeK=flowOn?lifeKof(gameHour):1;
    const tvB=(flowOn&&gameHour>=19&&gameHour<23)?1.2:1;
    const frozen=perfL>=2;
    for(const gr of groups){
      gr.mat.opacity=dayK*lifeK;
      if(perfL>=3&&(gr.kind==='cur'||gr.kind==='plant')){gr.im.visible=false;continue}
      gr.im.visible=true;
      if(frozen)continue;                                   // L2：动画冻结为静态帧
      for(let i=0;i<gr.n;i++){const it=gr.inst[i];
        if(gr.kind==='tv'){
          it.t-=dt;
          if(it.t<=0){it.t=0.3+Math.random()*2.7;
            it.tb=[0.12,0.45,0.8,1][Math.floor(Math.random()*4)];
            if(Math.random()<0.12)it.ch=(it.ch+1)%3}
          it.b+=(it.tb-it.b)*Math.min(1,dt*8);
          const tn=TVTINT[it.ch];
          c.setRGB(tn[0]*it.b*tvB,tn[1]*it.b*tvB,tn[2]*it.b*tvB)}
        else if(gr.kind==='warm'){
          const b2=0.6+0.4*Math.sin(t*0.785+it.ph);         // 8s 呼吸
          c.setRGB(b2,0.85*b2,0.6*b2)}
        else if(gr.kind==='cur'){
          it.cover=0.5+0.5*Math.sin(t*6.283/40+it.ph);      // 40s 开合
          c.setRGB(0.16+(1-0.16)*it.cover,0.2+0.72*it.cover,0.28+0.5*it.cover)}
        else{
          const b2=0.85+0.15*Math.sin(t*0.8+it.ph);
          c.setRGB(0.55*b2,0.75*b2,0.5*b2)}
        gr.im.setColorAt(i,c)}
      gr.im.instanceColor.needsUpdate=true}
  });
  window.__life=()=>{
    const tv=groups[0];let tvOn=false;const tints=[];
    for(const it of tv.inst){if(it.b>0.35)tvOn=true;tints.push(it.ch)}
    const covers=groups[2].inst.map(it=>+it.cover.toFixed(2));

      return true}
    if(!c.turn&&c.e.az===16&&c.e.dx===1){                      // 走廊上：找前方未服务的站
      const bx=c.e.ax+c.e.dx*c.s;
      let best=-1,bd=1e9;
      STOPS.forEach((sp,i)=>{if(!sp.avail)return;const d=sp.x-bx;
        if(d>-1&&d<bd){bd=d;best=i}});
      if(best>=0&&bd>1.5)bs.appr=true;                         // 进站相位（段尾统一赋 state）
      if(best>=0){
        if(bd<=1.5){c.s=STOPS[best].x-1.5-c.e.ax;c.v=0;
          bs.phase='stopped';bs.t=0;bs.si=best;bs.appr=false;
          c.g.position.set(STOPS[best].x-1.5,0,14);c.g.rotation.y=0;
          return true}
        bs.appr=true;
        if(bd<=12)c.vBase=CRUISE*Math.max(0.12,(bd-1.5)/10.5); // 12m 内才减速（远距正常巡航）
        else c.vBase=CRUISE}}
    else if(!(c.turn||((c.e.az===16)&&(c.e.dx===1))))STOPS.forEach(s=>s.avail=true);
    let target=CRUISE*(wf||1);                                 // 自主巡航（×0.8 已含在 CRUISE）
    if(c.turn){target*=0.5;
      c.turn.t+=dt*c.v/c.turn.len;
      const{p0,p1,p2}=c.turn,tt=Math.min(c.turn.t,1);
      const tx=2*(1-tt)*(p1[0]-p0[0])+2*tt*(p2[0]-p1[0]),
            tz=2*(1-tt)*(p1[1]-p0[1])+2*tt*(p2[1]-p1[1]);
      c.g.position.set(bezT(p0[0],p1[0],p2[0],tt),0,bezT(p0[1],p1[1],p2[1],tt));
      c.g.rotation.y=Math.atan2(-tz,tx);
      if(c.turn.t>=1){c.e=c.turn.next;c.s=0;c.turn=null}
      bs.phase='turn';return true}
    if(c.e.len-c.s<8)target*=0.45;                             // 路口礼让
    c.v+=Math.max(-9*dt,Math.min(4.5*dt,target-c.v));
    c.s+=c.v*dt;
    if(c.s>=c.e.len){
      const nx=busNext(c.e),sl=c.s-c.e.len;
      if(nx){const bx2=c.e.ax+c.e.dx*c.e.len,bz2=c.e.az+c.e.dz*c.e.len;
        if(nx.dx===c.e.dx&&nx.dz===c.e.dz){c.e=nx;c.s=sl}
        else{const p0=[bx2+c.e.dz*LANE2,bz2-c.e.dx*LANE2],p2=[bx2+nx.dz*LANE2,bz2-nx.dx*LANE2];
          c.turn={p0,p1:[bx2,bz2],p2,t:0,len:Math.hypot(p0[0]-p2[0],p0[1]-p2[1])+2.5,next:nx}}}
      else c.s=c.e.len}
    if(!c.turn){c.g.position.set(c.e.ax+c.e.dx*c.s+c.e.dz*LANE2,0,
      c.e.az+c.e.dz*c.s-c.e.dx*LANE2);
      c.g.rotation.y=Math.atan2(-c.e.dz,c.e.dx)}
    bs.phase=c.turn?'turn':(bs.appr?'approach':'run');bs.appr=false;return true};
  // 验收钩子：把巴士挪到某台活车前方 15m 同车道停靠（制造确定性跟车会车）
  window.__busMeet=()=>{
    for(const c2 of window.__trafficFleet){
      if(c2.bus||!c2.g.visible)continue;
      if(c2.turn||c2.s>15||c2.e.dz!==0)continue;
      b.e={ax:c2.e.ax,az:c2.e.az,dx:c2.e.dx,dz:0,len:32,ix:c2.e.ix,iz:c2.e.iz};
      b.s=c2.s+15;b.v=0;b.turn=null;
      bs.phase='stopped';bs.t=0;bs.si=0;STOPS[0].avail=true;
      busG.position.set(b.e.ax+b.e.dx*b.s,0,b.e.az-2);busG.rotation.y=0;
      return c2.e.ax+'_'+c2.e.az}};
  window.__busCorridor=()=>{                               // 验收钩子：放回走廊起点（车道居中采样用）
    b.e={ax:-16,az:16,dx:1,dz:0,len:32,ix:3,iz:3};b.s=2;b.v=CRUISE;b.turn=null;
    bs.phase='run';bs.appr=false;
    busG.position.set(-14,0,14);busG.rotation.y=0};
  window.__bus=()=>({state:bs.phase,x:+busG.position.x.toFixed(2),z:+busG.position.z.toFixed(2),
    atStop:bs.phase==='stopped',stopIdx:bs.si,door:+bs.door.toFixed(2),v:+b.v.toFixed(2),
    corridor:b.e.az===16&&b.e.dx===1&&!b.turn,
    laneDev:+Math.abs(busG.position.z-14).toFixed(3),
    signGlow:+(signM.color.r/1.3).toFixed(3),snow:true});
}

/* ---------- R47 路口红绿灯：主干 4 路口×4 来向（绿9黄2红11+相位错峰）+ R21 停止线停等 ---------- */
{
  const SIG=[[-16,16],[48,16],[-16,-16],[48,-16]];         // 有真实横断交通的路口（避 x=16/-48 禁行纵路）
  const CYC=22,GY=12,YY=2,OFFS=[0,5.5,11,16.5],LINE=11.2;  // 红 8s：压缩链式等待（城市信号协调折衷）
  const acc=SIG.map(()=>({t:Math.round(Math.random()*10),flash:0,passed:0,viol:0,wait:0,holds:0}));
  const prevH=[0,0,0,0];
  let simT=0,holding=0;
  const rawPhase=(ni,axis,t)=>{
    let ct=(t+OFFS[ni])%CYC;
    if(axis==='v'){ct=(ct+CYC-(GY+YY))%CYC;                // V 轴：主路绿 12/次路绿 8（无绿冲突）
      return ct<CYC-(GY+YY)?'g':'y'}
    return ct<GY?'g':ct<GY+YY?'y':'r'};
  const sigState=(ni,axis)=>{
    const it=acc[ni];
    if(it.flash>0)return{ph:((simT*5|0)%2)?'y':'r',flash:true};
    return{ph:rawPhase(ni,axis,it.t),flash:false}};
  const smap=new Map();SIG.forEach(([sx,sz],i)=>smap.set(sx+'_'+sz,i));
  window.__sigFor=c=>{
    if(!c.e||c.turn)return null;
    const ex=c.e.ax+c.e.dx*c.e.len,ez=c.e.az+c.e.dz*c.e.len;
    const ni=smap.get(ex+'_'+ez);if(ni===undefined)return null;
    const rem=c.e.len-c.s,rtl=rem-LINE;
    if(rtl>LINE+8||rtl<-1.0)return null;                   // 远处/已过线（刹车窗=线前 8m 起）
    const ph=sigState(ni,c.e.dz===0?'h':'v').ph;
    if(ph==='g')return null;
    if(ph==='y'&&rtl>6)return null;                        // 黄灯距线 >6m 可通过
    return{hold:rtl<=0.3,brake:rtl>0.3,rem,line:LINE,ni,ph}};
  // —— 视觉：杆+灯箱 merged 1 draw + 三色灯泡 IM×3 + 灯顶雪 1（=5 draws）
  const sigG=new THREE.Group();sigG.name='r47signals';world.add(sigG);
  const poles=[],caps=[],lampPos={r:[],y:[],g:[]},lampMeta=[];
  for(let ni=0;ni<SIG.length;ni++)for(let ai=0;ai<4;ai++){
    const[dx,dz]=[[1,0],[-1,0],[0,1],[0,-1]][ai];
    const px=SIG[ni][0]-dx*LINE-dz*1.6,pz=SIG[ni][1]-dz*LINE+dx*1.6;
    const pole=new THREE.CylinderGeometry(0.07,0.09,5.0,7);pole.translate(px,2.5,pz);poles.push(pole);
    const head=new THREE.BoxGeometry(0.34,1.05,0.3);head.translate(px,4.35,pz);poles.push(head);
    const cap=new THREE.BoxGeometry(0.4,0.05,0.36);cap.translate(px,4.92,pz);caps.push(cap);
    for(const[ly,col]of[[4.6,'r'],[4.34,'y'],[4.08,'g']]){
      lampPos[col].push([px-dx*0.19,ly,pz-dz*0.19]);
      lampMeta.push({col,ni,axis:ai<2?'h':'v',slot:lampPos[col].length-1})}}
  sigG.add(new THREE.Mesh(mergeGeometries(poles),toon(0x39404c)));
  const capMesh=new THREE.Mesh(mergeGeometries(caps),snowMat);sigG.add(capMesh);extraCaps.push(capMesh);
  const mkLamps=arr=>{const im=new THREE.InstancedMesh(new THREE.SphereGeometry(0.1,8,6),
      new THREE.MeshBasicMaterial({color:0xffffff}),arr.length);
    const M=new THREE.Matrix4();arr.forEach((p,i)=>{M.makeTranslation(p[0],p[1],p[2]);im.setMatrixAt(i,M)});
    im.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(arr.length*3).fill(0.05),3);
    sigG.add(im);return im};
  const lampIMs={r:mkLamps(lampPos.r),y:mkLamps(lampPos.y),g:mkLamps(lampPos.g)};
  // —— 逐帧：周期推进+夜间闪黄+违规/通过统计+灯色刷写
  const prevPos=new Map();
  window.__dbg47={frames:0,carsSeen:0,inWin:0,holds:0,fleet:0};
  tickers.push((t,dt)=>{
    simT+=dt;const D=window.__dbg47;D.frames++;D.fleet=(window.__trafficFleet||[]).length;
    acc.forEach((it,i)=>{
      if(it.flash>0){it.flash-=dt;return}
      it.t+=dt;
      const h=rawPhase(i,'h',it.t);
      if(prevH[i]==='y'&&h==='r'&&timeOfDay==='night'&&Math.random()<0.2)it.flash=3;
      prevH[i]=h});
    holding=0;
    for(const c of (window.__trafficFleet||[])){
      if(c.bus||!c.e)continue;
      D.carsSeen++;
      const ex=c.e.ax+c.e.dx*c.e.len,ez=c.e.az+c.e.dz*c.e.len;
      const ni=smap.get(ex+'_'+ez);if(ni===undefined)continue;
      const rem=c.e.len-c.s,rtl=rem-LINE;
      if(rtl>LINE+1||rtl<-1.5)continue;
      D.inWin++;
      const st=sigState(ni,c.e.dz===0?'h':'v');
      const pk=prevPos.get(c);
      if(pk!==undefined&&pk>0&&rtl<=0){                      // 过线=rtl 穿零（pk/rtl 同为过线距坐标系）
        if(st.ph==='r'&&rtl<-2)acc[ni].viol++;               // 红灯且深入 2m=闯红（刹车过冲不算）
        else if(st.ph!=='r')acc[ni].passed++}
      if(st.ph!=='g'){
        if(rtl<=0.3){holding++;
          if(!c._sw){c._sw=simT;acc[ni].holds++}             // 等待按会话计数
          acc[ni].wait+=dt}
        else if(c._sw)c._sw=0}
      else if(c._sw){c._sw=0}                                  // 绿灯释放
      prevPos.set(c,rtl)}
    // 灯色刷写（slot=同色 IM 内实例号，跨色不能共用 i）
    lampMeta.forEach(lm=>{
      const st=sigState(lm.ni,lm.axis);
      let b=0.05;
      if(st.flash)b=(lm.col==='y')?(((simT*5|0)%2)?2.4:0.1):0.05;
      else if(st.ph===lm.col)b=2.4;
      const im=lampIMs[lm.col];im.instanceColor.array[lm.slot*3]=b;
      im.instanceColor.array[lm.slot*3+1]=b;im.instanceColor.array[lm.slot*3+2]=b});
    lampIMs.r.instanceColor.needsUpdate=true;
    lampIMs.y.instanceColor.needsUpdate=true;
    lampIMs.g.instanceColor.needsUpdate=true;
  });
  window.__signals=()=>({lights:SIG.map((_,i)=>({idx:i,h:sigState(i,'h').ph,v:sigState(i,'v').ph,
      flash:acc[i].flash>0})),
    t:+simT.toFixed(1),violations:acc.reduce((a,b)=>a+b.viol,0),
    passed:acc.map(a=>a.passed),snow:true,holding,
    avgWait:+(acc.reduce((a,b)=>a+b.wait,0)/Math.max(1,acc.reduce((a,b)=>a+b.holds,0))).toFixed(1)});
}

/* ---------- R48 深夜编排与出租车：タクシー顶灯 + flow 凌晨 2-4 点全城最静（五项编排接线） ---------- */
{
  // —— 出租车 ×1（砍量预案 2→1；轿车 CAR_TYPES[0]+CAR_COLS[2] 深灰黑；顶灯牌昼灭 ×0.12）
  const taxiG=makeCar(city,0,0,0,0,2);
  taxiG.userData.isBus=true;                               // DENSF 豁免复用（顶灯车夜间被藏=穿帮）
  taxiG.name='r48taxi';
  const signT=texCanvas(128,40,(g)=>{g.fillStyle='#e8e8e8';g.fillRect(0,0,128,40);
    g.fillStyle='#c0392b';g.font='bold 28px "Yu Gothic","Meiryo",sans-serif';
    g.textAlign='center';g.textBaseline='middle';g.fillText('タクシー',64,21)});
  const signM=new THREE.MeshBasicMaterial({map:signT});
  signM.color.multiplyScalar(1.35);
  const sign=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.17,0.24),signM);
  sign.position.set(0.2,1.34,0);taxiG.add(sign);
  dayFade(e=>{signM.color.setScalar(1.35*(1-0.88*e))});    // 顶灯昼灭
  const tx={g:taxiG,vBase:8.2,v:3,e:{ax:-16,az:-16,dx:1,dz:0,len:32,ix:3,iz:2},s:16,turn:null};
  window.__trafficFleet.push(tx);                          // 混入车流（普通运动学，R47 信号照常遵从）
  // —— 猫夜游权重接线（R41 预留 __catNightMul）
  tickers.push(()=>{
    const h=gameHour;
    window.__catNightMul=(flowOn&&h>=2&&h<4)?1.8:1;
  });
  window.__taxi=()=>({cars:1,
    x:+taxiG.position.x.toFixed(1),z:+taxiG.position.z.toFixed(1),
    v:+tx.v.toFixed(1),topLit:signM.color.r>0.2,
    catMul:window.__catNightMul||1,
    traffic:window.__trafficCars?window.__trafficCars.filter(g=>g.visible).length:0,
    shopsClosed:window.__shops?window.__shops().closed:0,
    lifeDim:window.__life?window.__life().nightDim:1,
    night:flowOn&&gameHour>=2&&gameHour<4});
}

/* ---------- R49 晴夜星空：第 7 天气态 clear + 繁星/银河/流星 + 晴夜 env 预构建 + 塔楼泛光 ---------- */
{
  window.__envSnow=scene.environment;                      // 捕获雪夜 env（切换只换引用=零运行时重建）
  // —— 晴夜 env（启动时预构建第二 PMREM：深蓝天幕+星点）
  {
    const face=d=>{const c=document.createElement('canvas');c.width=c.height=64;d(c.getContext('2d'));return c};
    const skyC=g=>{const gr=g.createLinearGradient(0,0,0,64);gr.addColorStop(0,'#02030a');gr.addColorStop(0.7,'#050914');gr.addColorStop(1,'#0a1120');
      g.fillStyle=gr;g.fillRect(0,0,64,64);
      for(let i=0;i<24;i++){g.fillStyle=`rgba(215,228,255,${0.2+Math.random()*0.5})`;
        g.fillRect(Math.random()*64,Math.random()*38,1,1)}};
    const sides=[
      g=>{skyC(g)},g=>{skyC(g)},
      g=>{g.fillStyle='#010208';g.fillRect(0,0,64,64);for(let i=0;i<30;i++){g.fillStyle='rgba(220,230,255,0.6)';g.fillRect(Math.random()*64,Math.random()*64,1,1)}},
      g=>{g.fillStyle='#05080f';g.fillRect(0,0,64,64)},
      g=>{skyC(g)},g=>{skyC(g)}];
    const cube=new THREE.CubeTexture(sides.map(f=>face(f)));
    cube.colorSpace=THREE.SRGBColorSpace;cube.needsUpdate=true;
    const pm=new THREE.PMREMGenerator(renderer);
    window.__envClear=pm.fromCubemap(cube).texture;pm.dispose();
  }
  let curEnv='snow';
  // —— 星空组（fog:false 关键：FogExp2 在 460m 处会吞掉 93% 星光）
  const starG=new THREE.Group();starG.name='r49stars';world.add(starG);
  const dotT=texCanvas(32,32,(g)=>{const r=g.createRadialGradient(16,16,0,16,16,15);
    r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(0.4,'rgba(228,238,255,0.6)');
    r.addColorStop(1,'rgba(228,238,255,0)');g.fillStyle=r;g.fillRect(0,0,32,32)});
  const mkStarMat=(size,op,col)=>new THREE.PointsMaterial({size,map:dotT,transparent:true,
    opacity:op,sizeAttenuation:false,depthWrite:false,fog:false,
    blending:THREE.AdditiveBlending,color:col});
  const starB=mkStarMat(2.6,0,0xf4f6ff),starD=mkStarMat(1.5,0,0xdde6f5),galM=mkStarMat(1.9,0,0xbfd4ff);
  {
    const dome=n=>{let x,y,z;do{x=(Math.random()*2-1)*460;z=(Math.random()*2-1)*460;
      y=Math.random()*430+25}while(x*x+y*y+z*z>460*460);
      return[x,y,z]};
    const fill=(g2,n)=>{const p=new Float32Array(n*3);
      for(let i=0;i<n;i++){const q=dome();p[i*3]=q[0];p[i*3+1]=q[1];p[i*3+2]=q[2]}
      const gg=new THREE.BufferGeometry();
      gg.setAttribute('position',new THREE.BufferAttribute(p,3));return gg};
    starG.add(new THREE.Points(fill(0,300),starB));          // 亮星 300
    starG.add(new THREE.Points(fill(0,1100),starD));         // 暗星 1100
    // 银河带：斜 35° 大圆 + 高斯散布 3000
    const nrm=new THREE.Vector3(Math.sin(0.61),Math.cos(0.61),0).normalize();
    const u0=new THREE.Vector3(1,0,0).cross(nrm).normalize();
    const v0=nrm.clone().cross(u0).normalize();
    const gp=new Float32Array(3000*3);let gi=0;
    while(gi<3000){const th=Math.random()*6.283;
      const sp=(Math.random()+Math.random()+Math.random()-1.5)*(Math.random()<0.7?55:140);
      const px=Math.cos(th)*460,py=Math.sin(th)*460;
      const x=u0.x*px+v0.x*py+nrm.x*sp,y=u0.y*px+v0.y*py+nrm.y*sp,z=u0.z*px+v0.z*py+nrm.z*sp;
      if(y<18)continue;
      gp[gi*3]=x;gp[gi*3+1]=y;gp[gi*3+2]=z;gi++}
    const gg=new THREE.BufferGeometry();
    gg.setAttribute('position',new THREE.BufferAttribute(gp,3));
    starG.add(new THREE.Points(gg,galM));
  }
  // —— 流星（Line 拖尾 24 点，90-240s 一道；forceMeteor 验收）
  const metGeo=new THREE.BufferGeometry();
  metGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(24*3),3));
  const metM=new THREE.LineBasicMaterial({color:0xcfe4ff,transparent:true,opacity:0,fog:false});
  const meteor=new THREE.Line(metGeo,metM);meteor.frustumCulled=false;starG.add(meteor);
  const metP=new THREE.Vector3(),metV=new THREE.Vector3();
  let metT=-1,metNext=90+Math.random()*150;
  const spawnMeteor=()=>{metP.set((Math.random()*2-1)*240,200+Math.random()*120,(Math.random()*2-1)*240);
    const a=Math.random()*6.283;metV.set(Math.cos(a)*150,-(60+Math.random()*60),Math.sin(a)*150);metT=0};
  // —— 塔楼泛光：四段退台淡青边条（昼灭）
  const stripM=new THREE.MeshBasicMaterial({color:0x6fd8c8,transparent:true,opacity:0.5});
  dayFade(e=>{stripM.opacity=0.5*(1-0.94*e)});
  {const sg=[];for(const[w2,y2]of[[14.4,10],[12.4,20],[10.4,30],[8.4,40]]){
    const g2=new THREE.BoxGeometry(w2,0.16,w2);g2.translate(-32,y2,-64);sg.push(g2)}
    world.add(new THREE.Mesh(mergeGeometries(sg),stripM))}
  // —— 逐帧：clearE 缓动/星空可见性/env 切换/bg·fog·moon 覆写/流星/L3 挂级
  let clearE=0,appr=0,perfL49=0,perfT=0;
  const clearBg=new THREE.Color(0x060a18);
  window.__clearE=0;
  tickers.push((t,dt)=>{
    appr=(precip==='clear')?1:0;
    clearE+=(appr-clearE)*Math.min(1,dt*0.8);window.__clearE=clearE;
    const vis=clearE*(1-dayE)*(perfL49<3?1:0);
    const tw=0.92+0.08*Math.sin(t*0.7);
    starB.opacity=0.9*vis*tw;starD.opacity=0.6*vis;galM.opacity=0.5*vis;
    starG.visible=vis>0.02;
    if(curEnv==='snow'&&clearE>=0.5){scene.environment=window.__envClear;curEnv='clear'}
    if(curEnv==='clear'&&clearE<0.5){scene.environment=window.__envSnow;curEnv='snow'}
    scene.background.lerp(clearBg,clearE*0.9);
    scene.fog.color.lerp(clearBg,clearE*0.9);
    moon.intensity*=1+0.35*clearE;
    if(vis>0.4){metNext-=dt;
      if(metNext<=0&&metT<0){spawnMeteor();metNext=90+Math.random()*150}}
    if(metT>=0){metT+=dt;const k=metT/0.9;
      const arr=metGeo.attributes.position.array;
      for(let i=0;i<24;i++){const tt=Math.max(0,k-i*0.02);
        arr[i*3]=metP.x+metV.x*tt;arr[i*3+1]=metP.y+metV.y*tt-2.2*tt*tt;arr[i*3+2]=metP.z+metV.z*tt}
      metGeo.attributes.position.needsUpdate=true;
      metM.opacity=Math.sin(Math.min(1,k)*Math.PI)*0.9*vis;
      if(k>=1){metT=-1;metM.opacity=0}}
    if(t-perfT49>0.3){perfT49=t;const pf=window.__perf?window.__perf():null;perfL49=pf?pf.level:0}

/* ---------- R51 雪的形态：鹅毛/细雪双档（风场滞回+1.5s 缓动）+ 六角雪片 ---------- */
{

  const smats=[snow1.material,snow2.material];
  smats.forEach(m=>{m.uniforms.uSizeK={value:1};m.uniforms.uSwayK={value:1};m.uniforms.uWindK={value:1.5}});
  tickers.push((t,dt)=>{

    let tgt=morph>0.5?1:0;

      m.uniforms.uSizeK.value=sizeK;m.uniforms.uSwayK.value=swayK;m.uniforms.uWindK.value=windK});

{

  const bGeo=new THREE.ConeGeometry(0.028,0.78,4);bGeo.translate(0,0.39,0);

     cg.rotateZ(lean);cg.translate(bx,1.35*s,bz);culm.push(cg);
     for(let l=0;l<4;l++){const la=new THREE.ConeGeometry(0.1*s,0.6*s,5);
       la.rotateZ(-0.9-l*0.3);la.translate(bx+c55(lean)*(2.2+l*0.15)*s*(l%2?1:-0.6),(2.2+l*0.12)*s,bz+s55(l*2)*0.2*s);

   world.add(new THREE.Mesh(mergeGeometries(culm),toon(0x6b8a3a)));

  const pond=new THREE.Mesh(new THREE.CircleGeometry(2.9,22),

   e3.position.set(85,0.1,29);extraCaps.push(e3)}
  // —— 芒草风摆（逐实例 lean+摆；IM 矩阵每帧更新 ~91 实例）

/* ---------- R56 便利店内部可见：关东煮玻璃罩 + 回转杂志架 + 锅口蒸汽 + 店内灯板增亮 ----------
   盘点修正（账本意图≠事实第6次）：样品店内已有中岛货架×2+端头饭团塔（=「货架三列」）、壁挂杂志架、
   敞口关东煮柜台、收银台——不重复建造，只做四件真实增量（全部室内、不触碰外观零偏差红线）：
   ①关东煮玻璃罩（敞口锅加四面玻璃+顶，合并单 draw）②回转杂志架（窗前可见位，8 封面缓转）
   ③关东煮蒸汽（2 缕 sprite 升腾）④天花灯板 panelMat 1.7→等效 ×1.85（+9% 店内光，不动样品行） */
{
  const oden={x:2.72,z:2.3};
  // ① 玻璃罩：截面 0.8×0.8，台面 0.9 → 1.68；五面合并 1 draw + 角柱/顶沿合并 1 draw
  const paneMat=new THREE.MeshBasicMaterial({color:0xcfe4ea,transparent:true,opacity:0.13,depthWrite:false});
  const PW=0.78,PH=0.76,PY0=0.92;
  const paneGeo=(w,h)=>new THREE.PlaneGeometry(w,h);
  const pg=[paneGeo(PW,PH).translate(0,PY0+PH/2,PW/2),           // +z
            paneGeo(PW,PH).rotateY(Math.PI).translate(0,PY0+PH/2,-PW/2),
            paneGeo(PW,PH).rotateY(Math.PI/2).translate(PW/2,PY0+PH/2,0),
            paneGeo(PW,PH).rotateY(-Math.PI/2).translate(-PW/2,PY0+PH/2,0),
            paneGeo(PW,PW).rotateX(-Math.PI/2).translate(0,PY0+PH,0)];
  const caseG=new THREE.Group();caseG.position.set(oden.x,0,oden.z);
  const paneMesh=new THREE.Mesh(mergeGeometries(pg),paneMat);paneMesh.renderOrder=13;caseG.add(paneMesh);
  const fr=[];
  for(const sx of[-1,1])for(const sz of[-1,1])
    fr.push(new THREE.BoxGeometry(0.03,PH,0.03).translate(sx*(PW/2-0.015),PY0+PH/2,sz*(PW/2-0.015)));
  fr.push(new THREE.BoxGeometry(PW+0.03,0.03,PW+0.03).translate(0,PY0+PH+0.015,0));
  fr.push(new THREE.BoxGeometry(PW+0.03,0.04,PW+0.03).translate(0,PY0-0.02,0));
  caseG.add(new THREE.Mesh(mergeGeometries(fr),toon(0x9aa3ad)));
  interior.add(caseG);
  // ③ 锅口蒸汽：2 缕 sprite（锅口 y≈1.2 升腾 0.95m，正弦包络淡入淡出）
  const stTex=texCanvas(32,32,g=>{const gr=g.createRadialGradient(16,16,2,16,16,15);
    gr.addColorStop(0,'rgba(240,232,220,0.85)');gr.addColorStop(1,'rgba(240,232,220,0)');g.fillStyle=gr;g.fillRect(0,0,32,32)});
  const wisps=[0.0,0.5].map(off=>{
    const m=new THREE.SpriteMaterial({map:stTex,transparent:true,opacity:0,depthWrite:false});
    const sp=new THREE.Sprite(m);sp.scale.set(0.24,0.24,1);sp.renderOrder=14;
    sp.position.set(oden.x,1.2,oden.z);interior.add(sp);
    return{sp,ph:off+rnd()*0.2}});
  // ② 回转杂志架：窗前可见位 (-0.5,2.35)，静止骨架合并 1 draw + 8 封面 IM 1 draw，0.18 rad/s 缓转
  const rackG=new THREE.Group();rackG.position.set(-0.5,0,2.35);
  const rk=[new THREE.CylinderGeometry(0.022,0.022,1.06,8).translate(0,0.53,0),
            new THREE.CylinderGeometry(0.17,0.19,0.03,12).translate(0,0.045,0),
            new THREE.CylinderGeometry(0.018,0.018,0.52,8).translate(0,0.82,0),
            new THREE.CylinderGeometry(0.25,0.25,0.028,16).translate(0,1.08,0)];
  rackG.add(new THREE.Mesh(mergeGeometries(rk),toon(0x9aa3ad)));
  const spin=new THREE.Group();spin.position.y=0.62;rackG.add(spin);
  const cov=new THREE.InstancedMesh(new THREE.PlaneGeometry(0.17,0.23),
    new THREE.MeshBasicMaterial({map:magCoverTex,side:THREE.DoubleSide}),8);
  {const M=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),p=new THREE.Vector3(),
         s=new THREE.Vector3(1,1,1),col=new THREE.Color();
   for(let i=0;i<8;i++){const a=i/8*Math.PI*2,y=0.12+(i%2)*0.17;
     e.set(0,a,0);q.setFromEuler(e);p.set(Math.sin(a)*0.245,y,Math.cos(a)*0.245);
     M.compose(p,q,s);cov.setMatrixAt(i,M);cov.setColorAt(i,col.set(pick(goodsPalette)))}
   cov.instanceColor.needsUpdate=true}
  spin.add(cov);
  interior.add(rackG);
  // ④ 店内灯板 +5%：panelMat 是样品 const（模块级可达），运行期再乘 1.78/1.7，不改动样品行
  //    （1.85/1.7=+9% 版实测把店内推进 bloom 悬崖、橱窗大片白化，降档 +5% 保住货架细节）
  const pr0=panelMat.color.r;
  panelMat.color.multiplyScalar(1.78/1.7);
  // 动画（__freeze 期随 tickers 全停）：架子缓转 + 蒸汽升腾
  const stepR56=dt=>{
    spin.rotation.y=(spin.rotation.y+dt*0.18)%(Math.PI*2);
    for(const w of wisps){w.ph=(w.ph+dt*0.42)%1;
      const c=w.ph;
      w.sp.position.set(oden.x+Math.sin(w.ph*12.6)*0.09,1.2+c*0.95,oden.z+Math.cos(w.ph*9.4)*0.06);
      w.sp.material.opacity=0.34*Math.sin(c*Math.PI)}

  tickers.push((t,dt)=>stepR56(dt));
  window.__r56step=stepR56;
  window.__r56refs=[caseG,rackG,wisps[0].sp,wisps[1].sp];
  window.__interior=()=>({glass:1,frame:1,aisles:[0.75,-0.75],oden,
    rack:{x:-0.5,z:2.35,covers:8,angle:+(spin.rotation.y%(Math.PI*2)).toFixed(3)},
    steam:+wisps[0].sp.position.y.toFixed(2),steamOp:+wisps[0].sp.material.opacity.toFixed(3),
    panelRatio:+(panelMat.color.r/pr0).toFixed(3),
    parentsInterior:[caseG.parent===interior,rackG.parent===interior,
      wisps[0].sp.parent===interior,wisps[1].sp.parent===interior]});
